/* ----- workouts -----
   Tests are benchmarks with an official minimum and your own target; results are the
   log behind them, and Best and Status are always worked out from that log, never
   stored. Sessions are ready-made routines ticked through on a day: the ticks file
   under the civil day in train.days, so the week strip shows which days you trained. */
var TRAIN_SEGS=[["sessions","Sessions"],["tests","Tests"],["library","Library"]];
var TEST_STATUS={target:"At target",meets:"Meets standard",below:"Below standard",short:"Short of target",logged:"Logged",none:"Not tested"};
var trainSeg="sessions", trainSess=null, trainDay=null, testEditing=null, libFind="";

/* "12:30" and "1:15:00" are seconds, "Pass" is 1 and "Fail" 0, anything else its first number */
function testNum(v){
  v=String(v==null?"":v).trim();
  if(!v) return null;
  if(/^pass/i.test(v)) return 1;
  if(/^fail/i.test(v)) return 0;
  if(/\d:\d/.test(v)){
    var p=v.replace(/[^\d:.]/g,"").split(":").map(Number);
    if(p.some(isNaN)) return null;
    return p.reduce(function(a,x){ return a*60+x; },0);
  }
  var m=/-?\d+(\.\d+)?/.exec(v);
  return m? parseFloat(m[0]) : null;
}
/* a goal is stored bare; the direction comes from better, so "≥ 40" is shown, not kept */
function goalClean(v){ return String(v==null?"":v).replace(/^[≥≤<>=\s]+/,"").trim(); }
function goalText(t,v){
  v=goalClean(v);
  if(!v||t.better==="pass"||testNum(v)==null) return v;
  return (t.better==="lower"?"≤ ":"≥ ")+v;
}
function reaches(t,a,goal){ return t.better==="lower"? a<=goal : a>=goal; }
function findTest(name){
  var k=String(name||"").trim().toLowerCase(), hit=null;
  state.train.tests.forEach(function(t){ if(t.name.toLowerCase()===k) hit=t; });
  return hit;
}
function testById(id){
  var hit=null; state.train.tests.forEach(function(t){ if(t.id===id) hit=t; });
  return hit;
}
function resultsOf(t){
  return state.train.results.filter(function(r){ return r.test===t.id; })
    .sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
}
/* newest first, so a tie goes to the latest attempt */
function testBest(t){
  var best=null, bn=null;
  resultsOf(t).forEach(function(r){
    var n=testNum(r.v); if(n==null) return;
    if(best==null||(t.better==="lower"? n<bn : n>bn)){ best=r; bn=n; }
  });
  return best;
}
function testStatus(t){
  var best=testBest(t);
  if(!best) return "none";
  var b=testNum(best.v), g=testNum(goalClean(t.target)), m=testNum(goalClean(t.min));
  if(g!=null&&reaches(t,b,g)) return "target";
  if(m!=null) return reaches(t,b,m)?"meets":"below";
  return g!=null?"short":"logged";
}
function testMet(t){ var s=testStatus(t); return s==="meets"||s==="target"; }

/* the strip only reaches back to Monday and never past today */
function trainKey(){
  if(trainDay==null||trainDay>weekIdx()) trainDay=weekIdx();
  return keyOf(dayDate(trainDay));
}
function ticksOn(k,sid){ var d=state.train.days[k]; return (d&&d[sid])||{}; }
function trainedOn(k){
  var d=state.train.days[k];
  return d? state.train.sessions.filter(function(s){ return d[s.id]; }).length : 0;
}
function sessionCount(s,k){
  var t=ticksOn(k,s.id), n=0;
  s.items.forEach(function(it){ if(t[it.id]) n++; });
  return n;
}
function tickMove(k,sid,iid){
  var days=state.train.days, d=days[k]||(days[k]={}), s=d[sid]||(d[sid]={});
  if(s[iid]) delete s[iid]; else s[iid]=1;
  if(!Object.keys(s).length) delete d[sid];
  if(!Object.keys(d).length) delete days[k];
  listStamp("train");
}

function trainSessions(pane,sub){
  var w=state.train, ti=weekIdx(), k=trainKey(), trained=0;
  var strip=mk("div","days");
  strip.setAttribute("role","tablist"); strip.setAttribute("aria-label","Day of the week");
  WEEKDAYS.forEach(function(name,i){
    var n=i<=ti? trainedOn(keyOf(dayDate(i))) : 0, on=i===trainDay;
    if(n) trained++;
    var b=mk("button","dayb"+(on?" on":"")+(i===ti?" today":"")); b.type="button";
    b.setAttribute("role","tab"); b.setAttribute("aria-selected",on?"true":"false");
    b.setAttribute("aria-label",name+(i===ti?", today":"")+(n?", trained":""));
    b.disabled=i>ti;
    b.appendChild(mk("span","dl",name.slice(0,3)));
    b.appendChild(mk("span","dn",String(dayDate(i).getDate())));
    var bar=mk("span","db"), bf=mk("i"); bf.style.width=(n?100:0)+"%"; bar.appendChild(bf); b.appendChild(bar);
    b.addEventListener("click",function(){ trainDay=i; render(); });
    strip.appendChild(b);
  });
  sub.textContent="Week of "+fmtDay(weekStart())+" · "+trained+" training day"+(trained===1?"":"s");
  pane.appendChild(strip);

  var sess=null;
  w.sessions.forEach(function(s){ if(s.id===trainSess) sess=s; });
  if(sess){
    var back=mk("button","linkbtn","‹ All sessions"); back.type="button"; back.style.alignSelf="flex-start";
    back.addEventListener("click",function(){ trainSess=null; render(); window.scrollTo(0,0); });
    pane.appendChild(back);
    pane.appendChild(sessionCard(sess,k));
    if(sessionCount(sess,k)){
      var foot=mk("div","pane-foot"), cl=mk("button","linkbtn","Clear these ticks"); cl.type="button";
      cl.addEventListener("click",function(){
        var d=w.days[k]; if(!d) return;
        delete d[sess.id]; if(!Object.keys(d).length) delete w.days[k];
        listStamp("train"); render();
      });
      foot.appendChild(cl); pane.appendChild(foot);
    }
    return;
  }
  if(!w.sessions.length){
    var e=mk("div","sec"), ep=mk("div","lempty");
    ep.appendChild(mk("p",null,"No sessions yet. Tell it about one, or load your workouts from a link."));
    e.appendChild(ep); pane.appendChild(e);
  }
  groupBy(w.sessions,function(s){ return s.group||"Sessions"; }).forEach(function(g){
    var card=mk("div","sec"), sh=mk("div","sec-head");
    sh.innerHTML=ICON.dumbbell;
    sh.appendChild(mk("span","sec-title",g.name));
    sh.appendChild(mk("span","sec-count",String(g.items.length)));
    card.appendChild(sh);
    var rows=mk("div","rows");
    g.items.forEach(function(s){
      var n=sessionCount(s,k), row=mk("button","row gi"); row.type="button";
      var tx=mk("span","gtext"); tx.appendChild(mk("span","label",s.title));
      tx.appendChild(mk("span","gsub",s.items.length+" move"+(s.items.length===1?"":"s")));
      row.appendChild(tx);
      if(n) row.appendChild(mk("span","hstreak",n+"/"+s.items.length));
      var ch=mk("span","tchev"); ch.innerHTML=ICON.right; row.appendChild(ch);
      row.addEventListener("click",function(){ trainSess=s.id; render(); window.scrollTo(0,0); });
      rows.appendChild(row);
    });
    card.appendChild(rows);
    pane.appendChild(card);
  });
}
function sessionCard(s,k){
  var ticks=ticksOn(k,s.id), card=mk("div","sec"), sh=mk("div","sec-head");
  sh.innerHTML=ICON.dumbbell;
  sh.appendChild(mk("span","sec-title",s.title));
  sh.appendChild(mk("span","sec-count",sessionCount(s,k)+"/"+s.items.length));
  card.appendChild(sh);
  if(s.note) card.appendChild(mk("p","tnote",s.note));
  var rows=mk("div","rows"), part="";
  s.items.forEach(function(it){
    if((it.part||"")!==part){ part=it.part||""; if(part) rows.appendChild(mk("div","tpart",part)); }
    var on=!!ticks[it.id], row=mk("div","row gi");
    row.setAttribute("role","checkbox"); row.setAttribute("aria-checked",on?"true":"false");
    row.setAttribute("aria-pressed",on?"true":"false"); row.tabIndex=0;
    row.innerHTML='<span class="box">'+ICON.check+'</span>';
    var tx=mk("span","gtext"); tx.appendChild(mk("span","label",it.name));
    var sub=[it.dose,it.cue].filter(Boolean).join(" · ");
    if(sub) tx.appendChild(mk("span","gsub",sub));
    if(it.alt) tx.appendChild(mk("span","gsub","Easier: "+it.alt));
    row.appendChild(tx);
    /* a move that is also a test gets a way to log it without leaving the session for long */
    var test=it.test&&findTest(it.test);
    if(test){
      var lb=mk("button","tlog","Log"); lb.type="button"; lb.setAttribute("aria-label","Log a result for "+test.name);
      lb.addEventListener("click",function(e){
        e.stopPropagation(); trainSeg="tests"; testEditing=test.id; render();
        var ed=document.querySelector("#train .gedit"); if(ed) ed.scrollIntoView({block:"center"});
      });
      row.appendChild(lb);
    }
    function flip(){ tickMove(k,s.id,it.id); buzz(); render(); }
    row.addEventListener("click",flip);
    row.addEventListener("keydown",function(e){ if(e.target===row&&(e.key===" "||e.key==="Enter")){ e.preventDefault(); flip(); } });
    rows.appendChild(row);
  });
  card.appendChild(rows);
  return card;
}

function trainTests(pane,sub){
  var tests=state.train.tests, std=0, met=0, untested=0;
  tests.forEach(function(t){
    if(testStatus(t)==="none") untested++;
    if(testNum(goalClean(t.min))!=null){ std++; if(testMet(t)) met++; }
  });
  sub.textContent=(std? met+" of "+std+" standards met · " : "")+untested+" not tested";
  pane.appendChild(datalist("dl_tgroups",tests.map(function(t){ return t.group; })));
  groupBy(tests,function(t){ return t.group||"Other"; }).forEach(function(g){
    var card=mk("div","sec"), sh=mk("div","sec-head");
    var m=g.items.filter(testMet).length;
    sh.innerHTML=ICON.flag;
    sh.appendChild(mk("span","sec-title",g.name));
    sh.appendChild(mk("span","sec-count",m+"/"+g.items.length+" met"));
    card.appendChild(sh);
    var rows=mk("div","rows");
    g.items.forEach(function(t){
      rows.appendChild(testRow(t));
      if(testEditing===t.id) rows.appendChild(testEditor(t));
    });
    card.appendChild(rows);
    pane.appendChild(card);
  });
  var foot=mk("div","pane-foot"), ab=mk("button","linkbtn","Add a test"); ab.type="button";
  ab.addEventListener("click",function(){
    var t={id:uid(),name:"New test",group:"Other",unit:"reps",min:"",target:"",better:"higher",note:""};
    state.train.tests.push(t); testEditing=t.id; listStamp("train"); render();
    var ed=document.querySelector("#train .gedit"); if(ed) ed.scrollIntoView({block:"center"});
  });
  foot.appendChild(ab); pane.appendChild(foot);
}
function testRow(t){
  var st=testStatus(t), best=testBest(t), row=mk("button","row gi"); row.type="button";
  row.setAttribute("aria-expanded",testEditing===t.id?"true":"false");
  var tx=mk("span","gtext"); tx.appendChild(mk("span","label",t.name));
  var bits=[t.unit];
  if(testNum(goalClean(t.min))!=null) bits.push("Min "+goalText(t,t.min));
  if(goalClean(t.target)) bits.push("Target "+goalText(t,t.target));
  if(t.note) bits.push(t.note);
  var sub=bits.filter(Boolean).join(" · ");
  if(sub) tx.appendChild(mk("span","gsub",sub));
  row.appendChild(tx);
  var val=mk("span","tval "+st);
  val.appendChild(mk("b",null,best?best.v:"—"));
  val.appendChild(mk("span",null,TEST_STATUS[st]));
  row.appendChild(val);
  row.addEventListener("click",function(){ testEditing = testEditing===t.id ? null : t.id; render(); });
  return row;
}
function testEditor(t){
  var box=mk("div","gedit"), pad=mk("div","dpad");
  var hint = t.unit==="time" ? "m:ss, e.g. 12:30" : t.better==="pass" ? "Pass or Fail" : (t.unit||"");
  var fv=field("Result","",hint), fd=field("Date",day,""), fn=field("Note","","Conditions, how it felt");
  fd.input.type="date"; fd.input.max=day;
  fn.input.autocapitalize="sentences";
  if(t.unit!=="time"&&t.better!=="pass") fv.input.inputMode="decimal";
  [fv,fd,fn].forEach(function(f){ pad.appendChild(f); });
  var msg=mk("p","hint"); msg.hidden=true; pad.appendChild(msg);
  pad.appendChild(mkBtn("Log result","primary",function(){
    var v=fv.input.value.trim();
    if(testNum(v)==null){ msg.textContent=v?"That isn't a result I can compare. Try "+(hint||"a number")+".":"Type a result first."; msg.hidden=false; return; }
    state.train.results.push({id:uid(),test:t.id,date:fd.input.value||day,v:v,note:fn.input.value.trim()});
    listStamp("train"); render();
  }));

  var hist=resultsOf(t);
  if(hist.length){
    pad.appendChild(mk("label",null,"History"));
    var ul=mk("ul","thist");
    hist.forEach(function(r){
      var li=mk("li");
      li.appendChild(mk("span","hd",r.date));
      li.appendChild(mk("span","hv",r.v));
      li.appendChild(mk("span","hn",r.note||""));
      var del=mk("button","mini del"); del.type="button"; del.innerHTML=ICON.trash;
      del.setAttribute("aria-label","Delete the result from "+r.date);
      del.addEventListener("click",function(){
        if(!confirm("Delete "+r.v+" from "+fmtDay(r.date)+"?")) return;
        state.train.results=state.train.results.filter(function(x){ return x!==r; });
        listStamp("train"); render();
      });
      li.appendChild(del);
      ul.appendChild(li);
    });
    pad.appendChild(ul);
  }

  var det=document.createElement("details");
  det.appendChild(summaryRow("edit","Edit test",null));
  var ep=mk("div","dpad");
  var fName=field("Test",t.name,""), fGroup=field("Group",t.group,"Strength"), fUnit=field("Unit",t.unit,"reps, time, kg, pass/fail"),
      fMin=field("Official minimum",t.min,"Leave blank if there isn't one"), fTarget=field("Your target",t.target,""),
      fNote=field("Note",t.note,"");
  fGroup.input.setAttribute("list","dl_tgroups");
  [fName,fGroup,fUnit,fMin,fTarget,fNote].forEach(function(f){ ep.appendChild(f); });
  var bf=mk("div","field"), bl=mk("label",null,"Better is"), bs=document.createElement("select");
  [["higher","Higher"],["lower","Lower (times)"],["pass","Pass / fail"]].forEach(function(o){ bs.appendChild(new Option(o[1],o[0])); });
  bs.value=t.better||"higher"; bl.setAttribute("for",bs.id="f_"+uid());
  bf.appendChild(bl); bf.appendChild(bs); ep.appendChild(bf);
  var row=mk("div","row2");
  row.appendChild(mkBtn("Save","primary",function(){
    var n=fName.input.value.trim(); if(!n) return;
    t.name=n; t.group=fGroup.input.value.trim(); t.unit=fUnit.input.value.trim();
    t.min=goalClean(fMin.input.value); t.target=goalClean(fTarget.input.value);
    t.note=fNote.input.value.trim(); t.better=bs.value;
    listStamp("train"); render();
  }));
  row.appendChild(mkBtn("Delete","ghost danger",function(){
    var n=resultsOf(t).length;
    if(!confirm("Delete "+t.name+(n?" and its "+n+" result"+(n===1?"":"s"):"")+"?")) return;
    state.train.tests=state.train.tests.filter(function(x){ return x!==t; });
    state.train.results=state.train.results.filter(function(x){ return x.test!==t.id; });
    testEditing=null; listStamp("train"); render();
  }));
  ep.appendChild(row);
  det.appendChild(ep);
  pad.appendChild(det);
  box.appendChild(pad);
  return box;
}

function trainLibrary(pane,sub){
  var lib=state.train.library;
  var find=mk("form","find"), fin=document.createElement("input");
  fin.placeholder="Find an exercise"; fin.value=libFind; fin.setAttribute("aria-label","Find an exercise");
  fin.type="search"; fin.enterKeyHint="search";
  find.appendChild(fin);
  fin.addEventListener("input",function(){
    libFind=fin.value; var pos=fin.selectionStart; render();
    var again=document.querySelector("#train .find input"); if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
  });
  find.addEventListener("submit",function(e){ e.preventDefault(); fin.blur(); });
  pane.appendChild(find);
  var q=libFind.trim().toLowerCase();
  var shown=q? lib.filter(function(x){
    return [x.name,x.group,x.carry,x.cue].join(" ").toLowerCase().indexOf(q)>=0;
  }) : lib;
  sub.textContent=(q? shown.length+" of " : "")+lib.length+" exercise"+(lib.length===1?"":"s");
  if(!shown.length){
    var e=mk("div","sec"), ep=mk("div","lempty");
    ep.appendChild(mk("p",null,lib.length?"Nothing matches “"+libFind.trim()+"”.":"No exercises yet. They load from a link built from your sheet."));
    e.appendChild(ep); pane.appendChild(e);
  }
  groupBy(shown,function(x){ return x.group||"Other"; }).forEach(function(g){
    var card=mk("div","sec"), sh=mk("div","sec-head");
    sh.innerHTML=ICON.book;
    sh.appendChild(mk("span","sec-title",g.name));
    sh.appendChild(mk("span","sec-count",String(g.items.length)));
    card.appendChild(sh);
    var rows=mk("div","rows");
    g.items.forEach(function(x){
      var row=mk("div","row gi static"), tx=mk("span","gtext"), lab=mk("span","label");
      if(x.star){ var st=mk("span","star","★"); st.title="Trains a test directly"; lab.appendChild(st); }
      lab.appendChild(document.createTextNode(x.name));
      tx.appendChild(lab);
      var sub=[x.dose,x.cue].filter(Boolean).join(" · ");
      if(sub) tx.appendChild(mk("span","gsub",sub));
      if(x.carry) tx.appendChild(mk("span","gsub","→ "+x.carry));
      row.appendChild(tx);
      rows.appendChild(row);
    });
    card.appendChild(rows);
    pane.appendChild(card);
  });
}

function renderTrain(){
  var host=$("train"); host.innerHTML="";
  var pane=mk("div","pane"), head=mk("div","pane-head"), t=mk("div"), sub=mk("div","pane-sub");
  t.appendChild(mk("h2",null,"Workouts")); t.appendChild(sub);
  head.appendChild(t); pane.appendChild(head);
  var tellW=mk("div","tell"); tellBox(tellW,"Tell it","Log a result, or say what you did\u2026"); pane.appendChild(tellW);
  var seg=mk("div","seg");
  TRAIN_SEGS.forEach(function(o){
    var b=mk("button",trainSeg===o[0]?"on":null,o[1]); b.type="button";
    b.setAttribute("aria-pressed",trainSeg===o[0]?"true":"false");
    b.addEventListener("click",function(){ trainSeg=o[0]; testEditing=null; render(); window.scrollTo(0,0); });
    seg.appendChild(b);
  });
  pane.appendChild(seg);
  if(trainSeg==="tests") trainTests(pane,sub);
  else if(trainSeg==="library") trainLibrary(pane,sub);
  else trainSessions(pane,sub);
  host.appendChild(pane);
}

/* ----- import ----------
   One paste box for three things. A grocery sheet copied from Sheets or Excel
   arrives as tab-separated rows; a CSV export as comma-separated; an import
   prepared by Claude as JSON with any of habits, groceries and meals. Nothing is
   ever deleted: matching rows update, new ones are added. */
function truthy(v){ return /^(true|yes|y|1|x|✓|✔)$/i.test(String(v).trim()); }
function importGroceries(list){
  var added=0, updated=0;
  list.forEach(function(g){
    var name=String(g.name||"").trim(); if(!name) return;
    var hit=findGrocery(name);
    if(!hit){ hit={id:uid(),name:name,group:"",store:"",note:"",need:false}; state.groceries.items.push(hit); added++; }
    else updated++;
    if(g.group!=null) hit.group=String(g.group).trim();
    if(g.store!=null) hit.store=String(g.store).trim();
    if(g.note!=null) hit.note=String(g.note).trim();
    if(g.need!=null) hit.need=g.need===true||truthy(g.need);
    touched(hit);
  });
  if(added||updated){ state.groceries.mtime=Date.now(); groEpoch++; }
  return {added:added,updated:updated};
}
function importHabits(sections){
  var added=0, have={};
  state.sections.forEach(function(sec){ sec.items.forEach(function(it){ have[it.label.trim().toLowerCase()]=1; }); });
  sections.forEach(function(src){
    var title=String(src.title||"").trim(); if(!title) return;
    var sec=null;
    state.sections.forEach(function(x){ if(x.title.trim().toLowerCase()===title.toLowerCase()) sec=x; });
    (src.items||[]).forEach(function(label){
      label=String(label).trim(); if(!label||have[label.toLowerCase()]) return;
      if(!sec){ sec={id:uid(),icon:src.icon==="moon"?"moon":"sun",title:title,items:[]}; state.sections.push(sec); }
      sec.items.push({id:uid(),label:label}); have[label.toLowerCase()]=1; added++;
    });
  });
  if(added) touchToday();
  return added;
}
/* Workouts in the Tell it block shape. Tests and library entries match by name,
   sessions by title, results by test + date + value; a matched session takes the
   block's moves in its order, keeping the ids of moves it already had so the day's
   ticks survive. done ticks a session's moves on a day (all of them when no moves are
   named). A link (whole) carries the owner's whole list, so the kinds it holds replace
   what is here - the starter set included - while a spoken change only ever adds.
   Replaced entries keep their ids when a name comes back, so results stay attached.
   Returns one short line per thing changed, for the chips. */
function importWorkouts(src,whole){
  var w=state.train, n={tests:0,results:0,sessions:0,library:0,done:0}, prev={};
  function str(v){ return String(v==null?"":v).trim(); }
  function nameOf(x){ return str(x.name!=null?x.name:x.title).toLowerCase(); }
  if(whole) ["tests","sessions","library"].forEach(function(k){
    if(!Array.isArray(src[k])||!src[k].length) return;
    prev[k]={}; w[k].forEach(function(x){ prev[k][nameOf(x)]=x; }); w[k]=[];
  });
  function find(k,name){
    var key=name.toLowerCase(), hit=null;
    w[k].forEach(function(x){ if(nameOf(x)===key) hit=x; });
    if(!hit&&prev[k]&&prev[k][key]){ hit=prev[k][key]; delete prev[k][key]; w[k].push(hit); }
    return hit;
  }
  (src.tests||[]).forEach(function(x){
    var name=str(x.name); if(!name) return;
    var t=find("tests",name);
    if(!t){ t={id:uid(),name:name,group:"",unit:"",min:"",target:"",better:"higher",note:""}; w.tests.push(t); }
    ["group","unit","note"].forEach(function(k){ if(x[k]!=null) t[k]=str(x[k]); });
    ["min","target"].forEach(function(k){ if(x[k]!=null) t[k]=goalClean(x[k]); });
    if(x.better) t.better=/low/i.test(x.better)?"lower":/pass/i.test(x.better)?"pass":"higher";
    n.tests++;
  });
  if(prev.tests){
    var keep={}; w.tests.forEach(function(t){ keep[t.id]=1; });
    w.results=w.results.filter(function(r){ return keep[r.test]; });
  }
  (src.results||[]).forEach(function(r){
    var t=findTest(r.test), v=str(r.result!=null?r.result:r.v), d=str(r.date)||day;
    if(!t||testNum(v)==null||!/^\d{4}-\d\d-\d\d$/.test(d)) return;
    if(w.results.some(function(x){ return x.test===t.id&&x.date===d&&x.v===v; })) return;
    w.results.push({id:uid(),test:t.id,date:d,v:v,note:str(r.note)}); n.results++;
  });
  (src.sessions||[]).forEach(function(s){
    var title=str(s.title); if(!title) return;
    var hit=find("sessions",title);
    if(!hit){ hit={id:uid(),title:title,group:"",note:"",items:[]}; w.sessions.push(hit); }
    if(s.group!=null) hit.group=str(s.group);
    if(s.note!=null) hit.note=str(s.note);
    if(Array.isArray(s.items)){
      var old={};
      hit.items.forEach(function(it){ old[it.name.toLowerCase()]=it.id; });
      hit.items=s.items.map(function(x){
        if(typeof x==="string") x={name:x};
        var name=str(x.name), key=name.toLowerCase(); if(!name) return null;
        var it={id:old[key]||uid(),name:name}; delete old[key];
        ["dose","cue","alt","part","test"].forEach(function(k){ if(str(x[k])) it[k]=str(x[k]); });
        return it;
      }).filter(Boolean);
    }
    n.sessions++;
  });
  (src.library||[]).forEach(function(x){
    var name=str(x.name); if(!name) return;
    var hit=find("library",name);
    if(!hit){ hit={id:uid(),name:name}; w.library.push(hit); }
    ["dose","cue","carry","group"].forEach(function(k){ if(x[k]!=null) hit[k]=str(x[k]); });
    if(x.star!=null){ if(x.star===true||truthy(x.star)||x.star==="\u2605") hit.star=true; else delete hit.star; }
    n.library++;
  });
  (src.done||[]).forEach(function(e){
    var title=str(e.session).toLowerCase(), d=str(e.date)||day, sess=null;
    w.sessions.forEach(function(x){ if(x.title.toLowerCase()===title) sess=x; });
    if(!sess||!/^\d{4}-\d\d-\d\d$/.test(d)||d>day) return;
    var names=Array.isArray(e.moves)? e.moves.map(function(m){ return str(m).toLowerCase(); }) : null;
    var dd=w.days[d]||(w.days[d]={}), tk=dd[sess.id]||(dd[sess.id]={}), before=Object.keys(tk).length;
    sess.items.forEach(function(it){ if(!names||names.indexOf(it.name.toLowerCase())>=0) tk[it.id]=1; });
    if(!Object.keys(tk).length) delete dd[sess.id];
    if(!Object.keys(dd).length) delete w.days[d];
    if(Object.keys(tk).length>before) n.done++;
  });
  var did=[];
  function count(k,one,many){ if(n[k]) did.push(n[k]+" "+(n[k]===1?one:many)); }
  count("tests","test","tests");
  count("results","result logged","results logged");
  count("sessions","session","sessions");
  count("library","exercise","exercises");
  count("done","session ticked","sessions ticked");
  if(did.length) w.mtime=Date.now();
  return did;
}
/* ---------- tell it ----------
   One line on Today, Meals and Groceries where the person says what they want -
   "Monday dinner salmon and rice", "add eggs and spinach", "note I ran into Sam" -
   or asks a question. It goes to the Routines Console server (its own repo), which
   answers with Claude and can read and write Notion. Off until connected, like
   sync; the key lives only in this device's storage, never in the document or a
   setup link. Each message carries a plain-text snapshot of the tracker. What
   comes back into the app is a ```routines block (see applyAsk): the reply
   carries the change in the import shape and the app applies it in place. There
   is no chat tab: the last reply shows under the box until the next one, and the
   last few turns stay in memory so a follow-up ("make that Tuesday") still works. */
var ASKCFG="routines.ask";
lsDel("routines.askLog"); /* older builds kept a chat here */
/* The owner's server. An address is not a secret - every request still needs the key -
   so it is built in and a device only ever asks for the key. */
var HOME_SERVER="https://server-production-5580.up.railway.app";
function readJSON(k){ try{ return JSON.parse(lsGet(k)||"null"); }catch(e){ return null; } }
var askCfg=readJSON(ASKCFG);
if(!askCfg||!askCfg.url||!askCfg.key) askCfg=null;
/* The server stands in for Supabase in the sync code. mint: through the server an
   empty row is a first save, not a mistyped key (see pull). */
function serverCfg(){ return askCfg? {via:"server",url:askCfg.url,key:askCfg.key,mint:true} : null; }
function directCfg(){ try{ return JSON.parse(lsGet(CFGKEY)||"null"); }catch(e){ return null; } }
/* history must alternate user/assistant from a user turn, or the server rejects it */
var askLog=[], askBusy=false, askDraft="", askEditing=!askCfg;
/* the last reply, shown under the box: {text, did, trace, kind} */
var askLast=null;

/* What Claude sees of the tracker: today's list with ticks, streaks, two weeks of
   scores. Scored with the same functions as the stats view, so the numbers agree. */
function askContext(){
  var t=doneOn(day), lines=[];
  lines.push("Date: "+day+" ("+fmtDay(day,true)+"). Done today: "+t.done+" of "+t.total+".");
  state.sections.forEach(function(sec){
    if(!sec.items.length) return;
    lines.push("");
    lines.push((sec.title||"Untitled")+":");
    sec.items.forEach(function(it){
      var st=itemStreak(it.id);
      lines.push("- ["+(isDone(it.id)?"x":" ")+"] "+it.label+(st>=STREAK_MIN?" (streak "+st+" days)":""));
    });
  });
  lines.push("");
  lines.push("Full-day streak: "+curStreak()+" days (best "+bestStreak()+"). Only 100% days count toward it.");
  var keys=rangeKeys(14);
  if(keys.length) lines.push("Last "+keys.length+" days: "+keys.map(function(k){
    return k.slice(5)+" "+Math.round(pctOn(k)*100)+"%";
  }).join(", ")+".");
  var need=state.groceries.items.filter(function(it){ return it.need; });
  lines.push("");
  lines.push("Groceries needed: "+(need.length?need.length:"none")+".");
  groupBy(need,firstStore).forEach(function(g){
    lines.push("- "+g.name+": "+g.items.map(function(it){ return it.name+(it.note?" ("+it.note+")":""); }).join(", "));
  });
  lines.push("");
  lines.push("Meal plan, week of "+weekStart()+":");
  WEEKDAYS.forEach(function(d,i){
    var parts=state.meals.slots.map(function(sl){
      var c=mealAt(i,sl), picks=MEAL_FIELDS.map(function(f){ return c[f.k]; }).filter(Boolean);
      return picks.length? sl+": "+picks.join(", ")+(c.done?" (prepped)":"") : "";
    }).filter(Boolean);
    if(parts.length) lines.push("- "+d+(i===weekIdx()?" (today)":"")+": "+parts.join("; "));
  });
  var tr=state.train;
  lines.push("");
  lines.push("Workout sessions this week:");
  WEEKDAYS.forEach(function(d,i){
    if(i>weekIdx()) return;
    var k=keyOf(dayDate(i)), done=tr.sessions.filter(function(s){ return sessionCount(s,k); }).map(function(s){
      return s.title+" ("+sessionCount(s,k)+"/"+s.items.length+" moves)";
    });
    if(done.length) lines.push("- "+d+": "+done.join(", "));
  });
  lines.push("");
  lines.push("Fitness tests:");
  tr.tests.forEach(function(t){
    var b=testBest(t), bits=[b? "best "+b.v+" on "+b.date : "not tested"];
    if(testNum(goalClean(t.min))!=null) bits.push("min "+goalText(t,t.min));
    if(goalClean(t.target)) bits.push("target "+goalText(t,t.target));
    lines.push("- "+t.name+(t.unit?" ("+t.unit+")":"")+": "+bits.join(", ")+" - "+TEST_STATUS[testStatus(t)]);
  });
  return askRules()+"\n\n"+lines.join("\n").slice(0,12000);
}

/* How a reply changes the app. The rules ride along with the snapshot, so the
   server needs nothing new: when the person says what they want (plan Monday's
   dinner, add eggs, note something from the day), the model answers in prose and
   also returns one fenced ```routines block in the import shape. The app applies
   it and shows what changed as chips under the reply. A question gets no block. */
function askRules(){
  var opts=MEAL_FIELDS.map(function(f){
    return f.k+" ("+f.label+"): "+state.meals.options[f.k].map(function(o){ return o.name; }).join(", ");
  });
  var stores=dedupe(state.groceries.items.map(firstStore).filter(function(x){ return x!=="Anywhere"; }));
  var groups=dedupe(state.groceries.items.map(function(it){ return it.group; }).filter(Boolean));
  return [
    "You are the assistant inside a personal routines app. When the person asks a question, answer it.",
    "When the person tells you to change something - a meal plan, a meal prep or grocery schedule, the grocery list, a habit, a workout or fitness test result, or a note from their day - "+
    "confirm briefly in prose AND append exactly one fenced code block tagged routines containing JSON in this shape (include only the keys you change):",
    "```routines",
    '{"meals":{"plan":[{"day":"Monday","meal":"Dinner","main":"Salmon","side":"Rice","fruit":"","drink":"Water","note":"","clear":false}],'+
    '"options":{"main":[{"name":"Salmon","type":"Fish"}]},"slots":["Breakfast","Lunch","Dinner"]},'+
    '"groceries":[{"name":"Eggs","need":true,"store":"Costco","group":"Dairy","note":"2 dozen"}],'+
    '"habits":[{"title":"Morning","items":["Stretch"]}],'+
    '"workouts":{"results":[{"test":"Push-ups (max)","date":"'+day+'","result":"42","note":""}],'+
    '"done":[{"session":"Full body","date":"'+day+'","moves":["Squat"]}],'+
    '"tests":[{"name":"Plank hold","group":"Strength","unit":"time","min":"","target":"2:00","better":"higher"}]},'+
    '"notes":["Ran into Sam at the gym"]}',
    "```",
    "Rules: meal plan entries name a weekday and one of the meal slots; a field left out is kept as it is, \"\" clears it, clear:true clears the whole meal. "+
    "Prefer meal option names from the lists below; a new name is added as an option. New grocery items default to need:true; "+
    "\"got it\" or \"don't need\" means need:false. Groceries match by name, so repeating one updates it. "+
    "notes are appended to the scratch pad with today's date - use them for anything the person wants jotted down. "+
    "Workout results name a test exactly as listed below; times are m:ss or h:mm:ss, pass/fail tests take Pass or Fail, and the date defaults to today. "+
    "done ticks a session's moves on a day - leave out moves to tick the whole session, and never use a future day. Add a test only when asked to track a new one. "+
    "Never put the block in a reply to a plain question, and never invent changes the person did not ask for.",
    "Meal slots: "+state.meals.slots.join(", ")+".",
    "Meal options - "+opts.join("; ")+".",
    "Stores known: "+(stores.join(", ")||"none")+". Food groups known: "+(groups.join(", ")||"none")+".",
    "Habit sections: "+state.sections.map(function(x){ return x.title||"Untitled"; }).join(", ")+".",
    "Fitness tests - "+(state.train.tests.map(function(t){ return t.name+(t.unit?" ("+t.unit+")":""); }).join("; ")||"none")+".",
    "Workout sessions - "+(state.train.sessions.map(function(x){ return x.title; }).join("; ")||"none")+"."
  ].join("\n");
}
/* Split the block off a reply: {text, data}. data is null when there is none or it
   doesn't parse, and then the reply is shown as it came. */
function takeAskBlock(reply){
  var m=/```\s*routines[^\n]*\n([\s\S]*?)```/i.exec(reply);
  if(!m) return {text:reply,data:null};
  var data=null;
  try{ data=JSON.parse(m[1]); }catch(e){}
  if(!data||typeof data!=="object") return {text:reply,data:null};
  var text=(reply.slice(0,m.index)+reply.slice(m.index+m[0].length)).replace(/\n{3,}/g,"\n\n").trim();
  return {text:text,data:data};
}
/* Apply a block. Same functions as the import box, with two differences a spoken
   change needs: meal options merge instead of replacing the list, and a plan entry
   can clear a meal. Returns one short line per thing changed, for the chips. */
function applyAsk(data,whole){
  var did=[];
  if(data.meals&&typeof data.meals==="object"){
    var m=data.meals, n=0;
    if(m.options&&typeof m.options==="object") MEAL_FIELDS.forEach(function(f){
      var list=m.options[f.k]; if(!Array.isArray(list)) return;
      /* a link carries the owner's whole option list, so it replaces the starter
         set; a spoken change only ever adds */
      if(whole){ state.meals.options[f.k]=[]; n++; }
      var have=state.meals.options[f.k], names={};
      have.forEach(function(o){ names[o.name.toLowerCase()]=1; });
      list.forEach(function(o){
        var name=String(o&&o.name!=null?o.name:o||"").trim();
        if(!name||names[name.toLowerCase()]) return;
        have.push({name:name,type:String(o&&o.type||"").trim()}); names[name.toLowerCase()]=1; n++;
      });
    });
    if(Array.isArray(m.plan)) m.plan.forEach(function(e){
      var i=WEEKDAYS.map(function(d){ return d.toLowerCase(); }).indexOf(String(e.day||"").trim().toLowerCase());
      var slot=String(e.meal||"").trim(); if(i<0||!slot) return;
      if(state.meals.slots.indexOf(slot)<0){
        var hit=null; state.meals.slots.forEach(function(sl){ if(sl.toLowerCase()===slot.toLowerCase()) hit=sl; });
        if(!hit) return; slot=hit;
      }
      var key=mealKey(i,slot);
      if(e.clear===true){ if(state.meals.plan[key]){ delete state.meals.plan[key]; n++; } return; }
      var cell=state.meals.plan[key]||(state.meals.plan[key]={});
      MEAL_FIELDS.forEach(function(f){
        if(e[f.k]==null) return;
        var v=String(e[f.k]).trim();
        if(v){
          cell[f.k]=v;
          var names=state.meals.options[f.k].map(function(o){ return o.name.toLowerCase(); });
          if(names.indexOf(v.toLowerCase())<0) state.meals.options[f.k].push({name:v,type:""});
        } else delete cell[f.k];
      });
      if(e.note!=null){ if(String(e.note).trim()) cell.note=String(e.note).trim(); else delete cell.note; }
      if(e.done!=null) cell.done=!!e.done;
      if(!Object.keys(cell).length) delete state.meals.plan[key];
      n++;
      did.push(WEEKDAYS[i].slice(0,3)+" "+slot.toLowerCase()+(e.clear?" cleared":" planned"));
    });
    if(Array.isArray(m.slots)&&m.slots.length){ state.meals.slots=dedupe(m.slots.map(String)); n++; did.push("Meal slots"); }
    if(n){ state.meals.mtime=Date.now(); if(!did.length) did.push("Meal options"); }
  }
  if(Array.isArray(data.groceries)&&data.groceries.length){
    var g=importGroceries(data.groceries.map(function(x){
      if(x&&typeof x==="object"){ if(x.need==null) x.need=true; return x; }
      return {name:x,need:true};
    }));
    if(g.added) did.push(g.added+" grocer"+(g.added===1?"y":"ies")+" added");
    if(g.updated) did.push(g.updated+" grocer"+(g.updated===1?"y":"ies")+" updated");
  }
  if(Array.isArray(data.habits)&&data.habits.length){
    var h=importHabits(data.habits);
    if(h) did.push(h+" habit"+(h===1?"":"s")+" added");
  }
  if(data.workouts&&typeof data.workouts==="object")
    did=did.concat(importWorkouts(data.workouts,whole));
  var notes=data.notes==null?[]:(Array.isArray(data.notes)?data.notes:[data.notes]);
  notes=notes.map(function(x){ return String(x||"").trim(); }).filter(Boolean);
  if(notes.length){
    var stamp=fmtDay(day,false), cur=state.scratch||"";
    notes.forEach(function(t){ cur=(cur?cur.replace(/\s+$/,"")+"\n":"")+stamp+" \u00b7 "+t; });
    state.scratch=cur;
    did.push(notes.length===1?"Noted":notes.length+" notes added");
  }
  if(did.length){
    save();
    if(data.groceries) scheduleNotion();
  }
  return did;
}

/* Who answered: the server runs Claude or OpenAI, whichever key it has. */
function askWho(){ return lsGet("routines.askWho")||"Assistant"; }
function noteWho(model){
  var m=String(model||"");
  lsSet("routines.askWho", /^claude/i.test(m)?"Claude":/^gpt|^o\d/i.test(m)?"ChatGPT":"Assistant");
}
var TOOL_NAMES={
  notion_search:"Searched Notion", notion_list_rows:"Read a database", notion_read_page:"Read a page",
  notion_create_page:"Added to Notion", notion_append_text:"Wrote in Notion"
};
function askTurn(text,trace,kind,did){
  var t=document.createElement("div");
  t.className="ask-turn"+(kind?" "+kind:"");
  var w=document.createElement("div"); w.className="who"; w.textContent=askWho();
  t.appendChild(w);
  if((trace&&trace.length)||(did&&did.length)){
    var ul=document.createElement("ul"); ul.className="ask-trace"; ul.setAttribute("aria-label","What happened");
    (trace||[]).forEach(function(c){
      var li=document.createElement("li");
      if(!c.ok) li.className="bad";
      li.textContent=(TOOL_NAMES[c.tool]||c.tool.replace(/_/g," "))+(c.ok?"":" \u2014 failed");
      li.title=c.ok?(c.detail||""):(c.error||"");
      ul.appendChild(li);
    });
    (did||[]).forEach(function(d){
      var li=document.createElement("li"); li.className="did"; li.textContent="\u2713 "+d; ul.appendChild(li);
    });
    t.appendChild(ul);
  }
  String(text).split(/\n{2,}/).forEach(function(para){
    if(!para.trim()) return;
    var pEl=document.createElement("p"); pEl.textContent=para; t.appendChild(pEl);
  });
  return t;
}

function askButton(label,cls,onClick){
  var b=document.createElement("button"); b.type="button"; b.className="btn"+(cls?" "+cls:"");
  b.textContent=label; b.addEventListener("click",onClick);
  return b;
}

/* Face ID / Touch ID. A passkey stands in for typing the server key: the server checks
   it and hands this device the key, and from then on everything runs as if it had been
   typed. Turned on once from a device that has the key; iCloud Keychain carries the
   passkey to the owner's other Apple devices. The server keeps only public keys. */
var PASSKEY="routines.passkey";
function canPasskey(){
  return !!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext&&location.protocol==="https:");
}
function bioName(){
  var ua=navigator.userAgent||"";
  return /iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)? "Face ID"
       : /Macintosh/.test(ua)? "Touch ID" : "a passkey";
}
function b64uBuf(s){
  s=String(s).replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
  var b=atob(s), u=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
  return u.buffer;
}
function bufB64u(buf){
  var u=new Uint8Array(buf), s="";
  for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function passkeyCall(url,body,key){
  var h={"Content-Type":"application/json"};
  if(key) h.Authorization="Bearer "+key;
  return fetch(url+"/api/passkey",{method:"POST",headers:h,body:JSON.stringify(body)}).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if(!r.ok) throw new Error(d.error||("The server answered "+r.status+"."));
      return d;
    });
  });
}
function credList(a){
  return (a||[]).map(function(c){ return {type:"public-key",id:b64uBuf(c.id),transports:c.transports}; });
}
function passkeyWhy(e,verb){
  var n=e&&e.name;
  if(n==="NotAllowedError") return verb+" was cancelled or timed out.";
  if(n==="InvalidStateError") return "already";
  if(n==="SecurityError") return "Passkeys work only on the Routines site itself.";
  return (e&&e.message)||String(e);
}
/* Safari wants a passkey prompt to follow a tap closely. The challenge is fetched on the
   first tap and kept, so if Safari refuses because the fetch took too long, the next tap
   opens the prompt straight away. A challenge is good for three minutes. */
var pkOpts={};
function pkOptions(kind,url,key){
  var c=pkOpts[kind];
  if(c&&c.url===url&&Date.now()-c.at<150000) return c.p;
  var p=passkeyCall(url,{op:kind==="login"?"login-options":"register-options"},key);
  pkOpts[kind]={url:url,at:Date.now(),p:p};
  p.catch(function(){ delete pkOpts[kind]; });
  return p;
}
function passkeyLogin(url){
  var started;
  return pkOptions("login",url).then(function(d){
    if(d.none) throw new Error(bioName()+" sign-in isn't on yet. Connect once with the key, then turn it on under Edit list → Routines server.");
    var o=d.options; started=Date.now();
    return navigator.credentials.get({publicKey:{
      challenge:b64uBuf(o.challenge), rpId:o.rpId, timeout:o.timeout,
      userVerification:o.userVerification||"required", allowCredentials:credList(o.allowCredentials)
    }});
  }).then(function(cred){
    delete pkOpts.login;
    var r=cred.response;
    return passkeyCall(url,{op:"login",response:{
      id:cred.id, rawId:bufB64u(cred.rawId), type:cred.type, clientExtensionResults:{},
      response:{
        clientDataJSON:bufB64u(r.clientDataJSON), authenticatorData:bufB64u(r.authenticatorData),
        signature:bufB64u(r.signature), userHandle:r.userHandle?bufB64u(r.userHandle):undefined
      }
    }});
  }).then(function(d){ return d.key; }, function(e){
    /* refused before any prompt showed: keep the challenge so the next tap is instant */
    if(e&&e.name==="NotAllowedError"&&started&&Date.now()-started<1500) throw new Error("Tap again to use "+bioName()+".");
    delete pkOpts.login;
    throw new Error(passkeyWhy(e,bioName()));
  });
}
function passkeyRegister(){
  var started;
  return pkOptions("register",askCfg.url,askCfg.key).then(function(d){
    var o=d.options; started=Date.now();
    return navigator.credentials.create({publicKey:{
      rp:o.rp, user:{id:b64uBuf(o.user.id),name:o.user.name,displayName:o.user.displayName},
      challenge:b64uBuf(o.challenge), pubKeyCredParams:o.pubKeyCredParams, timeout:o.timeout,
      excludeCredentials:credList(o.excludeCredentials),
      authenticatorSelection:o.authenticatorSelection, attestation:"none"
    }});
  }).then(function(cred){
    delete pkOpts.register;
    var r=cred.response;
    return passkeyCall(askCfg.url,{op:"register",response:{
      id:cred.id, rawId:bufB64u(cred.rawId), type:cred.type, clientExtensionResults:{},
      response:{
        clientDataJSON:bufB64u(r.clientDataJSON), attestationObject:bufB64u(r.attestationObject),
        transports:r.getTransports?r.getTransports():[]
      }
    }},askCfg.key);
  }).then(function(){ lsSet(PASSKEY,"1"); }, function(e){
    if(e&&e.name==="NotAllowedError"&&started&&Date.now()-started<1500) throw new Error("Tap again to turn on "+bioName()+".");
    delete pkOpts.register;
    var why=passkeyWhy(e,"Setting up "+bioName());
    /* this Apple ID already holds the passkey: it's on, nothing to add */
    if(why==="already"){ lsSet(PASSKEY,"1"); return; }
    throw new Error(why);
  });
}

function connectWith(url,key){
  askCfg={url:url,key:key}; lsSet(ASKCFG,JSON.stringify(askCfg)); lsDel(ASKPEND);

/* The box itself. Built fresh on each render; the draft and the last reply live

function tellBox(host,hint,placeholder){
  host.innerHTML="";

  ta.addEventListener("input",function(){ askDraft=ta.value; });

  });

function tellSend(text){
  text=String(text||"").trim();
  if(!text||askBusy||!askCfg) return;
  askLog.push({role:"user",content:text});
  askDraft=""; askLast=null; askBusy=true;
  render();
  var tz=""; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""; }catch(e){}
  fetch(askCfg.url+"/api/chat",{
    method:"POST",
    headers:{"Authorization":"Bearer "+askCfg.key,"Content-Type":"application/json"},
    body:JSON.stringify({messages:askLog.slice(-11),timeZone:tz,context:askContext()})
  }).then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(d){ return {status:res.status,data:d||{}}; });
  }).then(function(r){
    if(r.status===200&&typeof r.data.reply==="string"){
      noteWho(r.data.model);
      var got=takeAskBlock(r.data.reply), did=[];
      if(got.data){ try{ did=applyAsk(got.data); }catch(e){ did=[]; } }
      var reply=got.text||(did.length?"Done.":r.data.reply);
      askLog.push({role:"assistant",content:reply});
      if(askLog.length>12) askLog.splice(0,askLog.length-12);
      askLast={text:reply,did:did,trace:r.data.trace||[],kind:""};
      return;
    }
    askLog.pop(); askDraft=text;
    askLast={text: r.status===401
      ? "Your server key was rejected. Open Edit list \u2192 Routines server and paste it again."
      : (r.data.error||("Your server answered "+r.status+".")), trace:r.data.trace||null, kind:"err"};
  },function(){
    askLog.pop(); askDraft=text;
    askLast={text:"Couldn't reach your Routines server. Check your connection and send again.",kind:"err"};
  }).then(function(){ askBusy=false; render(); });
}

/* ---------- groceries ⇄ Notion ----------
   With the console connected, the grocery list and a Notion database stay in step both
   ways. The app sends its whole list (each item with t, its last edit here, and s, when
   it last matched Notion) plus the ids it deleted; the console reconciles item by item
   and returns the merged list, which replaces this one. Runs a few seconds after a
   change, when the app opens, and when it comes back to the foreground. The cart tick
   (got) never leaves the device - it only means something mid-shop. */
var notionSync={state:"",at:0,msg:""}, notionTimer=null, notionBusy=false, notionAgain=false, notionLast=0;
function tombstone(id){
  var d=state.groceries.deleted||(state.groceries.deleted=[]);
  if(d.indexOf(id)<0) d.push(id);
  if(d.length>300) d.splice(0,d.length-300);
}
function scheduleNotion(ms){
  if(!askCfg) return;
  clearTimeout(notionTimer);
  notionTimer=setTimeout(syncNotion, ms==null?4000:ms);
}
/* on open and on return: at most once a minute, so flicking between apps costs nothing */
function freshenNotion(){
  if(askCfg&&!notionBusy&&Date.now()-notionLast>60000) scheduleNotion(1500);
}
function syncNotion(){
  if(!askCfg) return;
  if(notionBusy){ notionAgain=true; return; }
  notionBusy=true; notionLast=Date.now(); notionSync={state:"busy",at:0,msg:""}; paintNotion();
  var epoch=groEpoch, sentDeleted=(state.groceries.deleted||[]).slice();
  var items=state.groceries.items.map(function(it){
    var o={id:it.id,name:it.name,need:!!it.need,group:it.group||"",store:it.store||"",note:it.note||""};
    if(it.t) o.t=it.t; if(it.s) o.s=it.s;
    return o;
  });
  fetch(askCfg.url+"/api/groceries",{
    method:"POST",
    headers:{"Authorization":"Bearer "+askCfg.key,"Content-Type":"application/json"},
    body:JSON.stringify({items:items,deleted:sentDeleted})
  }).then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(d){ return {status:res.status,data:d||{}}; });
  }).then(function(r){
    if(r.status!==200||!Array.isArray(r.data.items)){
      notionSync={state:"err",at:0,msg:r.data.error||("Notion sync failed ("+r.status+").")};
      return;
    }
    notionSync={state:"ok",at:Date.now(),msg:""};
    /* edited while this was in flight: the reply is already stale, so go again */
    if(epoch!==groEpoch){ notionAgain=true; return; }
    applyNotion(r.data.items, sentDeleted);
  },function(){
    notionSync={state:"err",at:0,msg:"Couldn't reach your Routines server, so Notion wasn't synced."};
  }).then(function(){
    notionBusy=false; paintNotion();
    if(notionAgain){ notionAgain=false; syncNotion(); }
  });
}
function applyNotion(items,sentDeleted){
  var got={}, before=JSON.stringify(state.groceries.items);
  state.groceries.items.forEach(function(it){ if(it.got) got[it.id]=1; });
  state.groceries.items=items.map(function(x){
    var it={id:x.id,name:x.name,group:x.group||"",store:x.store||"",note:x.note||"",need:!!x.need};
    if(x.t) it.t=x.t; if(x.s) it.s=x.s;
    if(got[it.id]&&it.need) it.got=true;
    return it;
  });
  /* the deletes just sent are done; keep any made since */
  state.groceries.deleted=(state.groceries.deleted||[]).filter(function(id){ return sentDeleted.indexOf(id)<0; });
  /* stamp the list so other devices take it, but don't sync it straight back */
  state.groceries.mtime=Date.now(); save();
  if(JSON.stringify(state.groceries.items)!==before&&view==="groceries") render();
}
function notionLabel(){
  if(notionSync.state==="busy") return "Syncing with Notion…";
  if(notionSync.state==="err") return notionSync.msg;
  if(notionSync.state==="ok"){
    var m=Math.round((Date.now()-notionSync.at)/60000);
    return "Synced with Notion "+(m<1?"just now":m+" min ago");
  }
  return "Syncs with Notion both ways";
}
function paintNotion(){
  var el=document.getElementById("notionState");
  if(!el) return;
  el.textContent=notionLabel();
  el.className="pane-sub"+(notionSync.state==="err"?" err":"");
}

/* A one-time link: #i= carries base64 JSON in the Tell it block shape. Claude
   builds it from the owner's sheets so the lists arrive without a paste box.
   Applied once, then the hash is dropped so a reload can't apply it again. */
(function loadLink(){
  var m=/[#&]i=([A-Za-z0-9_\-]+)/.exec(location.hash||"");
  if(!m) return;
  history.replaceState(null,"",location.pathname+location.search);
  var did=[];
  try{
    var data=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))));
    did=applyAsk(data,true);
  }catch(e){ alert("That link didn't load: "+e.message); return; }
  var meals=did.filter(function(d){ return /planned|cleared/.test(d); }).length;
  var rest=did.filter(function(d){ return !/planned|cleared/.test(d); });
  if(meals) rest.unshift(meals+" meal"+(meals===1?"":"s")+" planned");
  setTimeout(function(){ alert(rest.length? "Loaded: "+rest.join(", ")+"." : "Nothing new in that link."); },300);
})();
if(askCfg) cfg=serverCfg();
else if(lsGet(ASKPEND)&&!cfg) setSync("off","Connect");
if(cfg) setSync("busy","Syncing…");
/* arrived on a setup link: the panel lives in edit mode, so say so on the chip -
   tapping it opens the panel, which is where the secret key gets pasted. */
else if(pending) setSync("off","Finish setup");
render();
if(cfg) pull();
/* after the Supabase pull has had a moment, so a fresh device syncs the merged list */
if(askCfg) setTimeout(freshenNotion, 1500);
})();
</script>
