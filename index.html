<style>
:root{
  --paper:#F0F0F1;
  --surface:#FFFFFF;
  --surface-2:#F6F6F7;
  --line:#D5D8DB;
  --line-soft:#E5E7EA;
  --ink:#0B0B0D;
  --ink-2:#5B646E;
  --ink-3:#8B959E;
  --accent:#A31F34;
  --accent-ink:#FFFFFF;
  --accent-soft:rgba(163,31,52,.10);
  --danger:#9A5B00;
  --shadow:0 1px 2px rgba(11,11,13,.06), 0 8px 24px -16px rgba(11,11,13,.30);
  --lift:0 2px 6px rgba(11,11,13,.10), 0 16px 32px -14px rgba(11,11,13,.40);
  --r:14px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0B0B0D;
    --surface:#151517;
    --surface-2:#1C1C1F;
    --line:#2E2E33;
    --line-soft:#242429;
    --ink:#EDEDEF;
    --ink-2:#A2A8AF;
    --ink-3:#767D85;
    --accent:#FF3B4E;
    --accent-ink:#0B0B0D;
    --accent-soft:rgba(255,59,78,.15);
    --danger:#E8A33D;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
    --lift:0 2px 8px rgba(0,0,0,.5), 0 20px 40px -16px rgba(0,0,0,.9);
  }
}
:root[data-theme="light"]{ color-scheme:light; }
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0B0B0D;
  --surface:#151517;
  --surface-2:#1C1C1F;
  --line:#2E2E33;
  --line-soft:#242429;
  --ink:#EDEDEF;
  --ink-2:#A2A8AF;
  --ink-3:#767D85;
  --accent:#FF3B4E;
  --accent-ink:#0B0B0D;
  --accent-soft:rgba(255,59,78,.15);
  --danger:#E8A33D;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
  --lift:0 2px 8px rgba(0,0,0,.5), 0 20px 40px -16px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(150px + env(safe-area-inset-bottom));
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.wrap{max-width:34rem;margin:0 auto;padding:0 16px 96px}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(12px);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line-soft);
  padding-top:env(safe-area-inset-top);
}
.top-inner{max-width:34rem;margin:0 auto;padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{
  font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;
  font-weight:700;font-size:26px;line-height:1;letter-spacing:-.02em;margin:0;
}
.back{
  display:flex;align-items:center;gap:3px;
  background:none;border:0;padding:0;margin:0;cursor:pointer;color:var(--ink);
  font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;
  font-weight:700;font-size:26px;line-height:1;letter-spacing:-.02em;
}
.back svg{width:21px;height:21px;flex:none;margin-left:-5px;color:var(--accent)}
.head-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.date{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink-2);
}
.chip{
  display:flex;align-items:center;gap:6px;
  background:none;border:0;padding:0;cursor:pointer;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
}
.chip i{width:6px;height:6px;border-radius:99px;background:var(--ink-3);flex:none}
.chip.ok i{background:var(--accent)}
.chip.err i{background:var(--danger)}
.chip.busy i{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.meter{display:flex;align-items:center;gap:10px}
.track{flex:1;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .35s cubic-bezier(.4,0,.2,1)}
.count{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);
}
.count b{color:var(--ink);font-weight:500}

.quote{
  margin:18px 0 22px;padding-left:14px;border-left:2px solid var(--accent);
  font-style:italic;color:var(--ink-2);font-size:14.5px;line-height:1.5;
}
.qhint{
  margin:-8px 0 18px 2px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}

/* ---------- sections ---------- */
.interlude{display:flex;align-items:center;gap:14px;margin:2px 0 18px;padding:0 6px}
.interlude .rule{flex:1;height:1px;background:var(--line)}
.interlude p{
  margin:0;font-style:italic;font-size:14px;line-height:1.4;
  color:var(--accent);text-align:center;text-wrap:balance;
}
.qedit.mid{text-align:center;color:var(--accent);min-height:52px;margin:2px 0 18px}

.sec{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;
}
.sec-head{
  display:flex;align-items:center;gap:8px;
  padding:13px 16px 11px;border-bottom:1px solid var(--line-soft);
  background:var(--surface-2);
}
.sec-head svg{width:14px;height:14px;color:var(--accent);flex:none}
.sec-title{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
}
.sec-count{
  margin-left:auto;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
}
.rows{display:flex;flex-direction:column}

.row{
  display:flex;align-items:center;gap:13px;width:100%;
  min-height:54px;padding:8px 16px;
  background:none;border:0;border-top:1px solid var(--line-soft);
  text-align:left;cursor:pointer;
}
.rows .row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.box{
  flex:none;width:23px;height:23px;border-radius:7px;
  border:1.6px solid var(--line);background:transparent;
  display:grid;place-items:center;
  transition:background .18s ease,border-color .18s ease,transform .18s cubic-bezier(.3,1.6,.6,1);
}
.box svg{width:13px;height:13px;color:var(--accent-ink)}
.box path{
  fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .22s ease .04s;
}
.row[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.row[aria-pressed="true"] .box path{stroke-dashoffset:0}
.row:active .box{transform:scale(.9)}
.label{font-size:16px;transition:color .18s ease}
.hstreak{
  margin-left:auto;flex:none;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;
  font-variant-numeric:tabular-nums;color:var(--ink-3);
}
.row[aria-pressed="true"] .hstreak{color:var(--accent)}
.row[aria-pressed="true"] .label{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}

/* ---------- log ---------- */
.log{margin-top:26px;padding:16px;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surface)}
.log-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.log-title{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.streak{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.streak b{color:var(--accent);font-weight:500}
.dots{display:flex;gap:6px;align-items:flex-end}
.day{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:none;border:0;padding:0;font:inherit;cursor:pointer;
}
.bar{display:block;width:100%;height:34px;border-radius:5px;background:var(--line-soft);position:relative;overflow:hidden}
.bar span{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:5px;transition:height .4s ease}
/* Tint the track rather than ring the bar: an outline adds its width to every
   side, which doubles a 3px all-time bar and makes today look nothing like the
   rest of the chart. Selected wins over today, so it comes second. */
.day.today .bar{background:var(--accent-soft)}
.day[aria-pressed="true"] .bar{background:var(--ink-3)}
.dow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;color:var(--ink-3);letter-spacing:.04em}
.day.today .dow{color:var(--accent)}
.day[aria-pressed="true"] .dow{color:var(--ink)}

/* ---------- one day, habit by habit ---------- */
.daydetail{
  margin-top:14px;padding:12px 13px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--line-soft);
}
.dd-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px}
.dd-date{font-size:13.5px;font-weight:500}
.dd-count{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);
}
.dd-sec{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  margin:11px 0 5px;
}
.dd-sec:first-of-type{margin-top:0}
.dd-item{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:14px;color:var(--ink-3)}
.dd-item.on{color:var(--ink)}
.dd-mark{
  flex:none;width:15px;height:15px;border-radius:5px;
  border:1.4px solid var(--line);display:grid;place-items:center;
}
.dd-item.on .dd-mark{background:var(--accent);border-color:var(--accent)}
.dd-mark svg{width:9px;height:9px;color:var(--accent-ink);opacity:0}
.dd-item.on .dd-mark svg{opacity:1}
.dd-mark path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.dd-changed{
  margin:10px 0 0;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;color:var(--ink-3);line-height:1.45;
}
.dd-note{
  margin:11px 0 0;padding-top:10px;border-top:1px solid var(--line-soft);
  font-size:13.5px;font-style:italic;color:var(--ink-2);line-height:1.5;
  white-space:pre-wrap;
}

/* ---------- habit by habit, over time ---------- */
.byhabit{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft)}
.bh-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.ranges{display:flex;gap:4px}
.rbtn{
  border:1px solid var(--line-soft);background:none;border-radius:7px;
  padding:5px 9px;cursor:pointer;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);
}
.rbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bh-empty{margin:10px 0 0;font-size:13px;color:var(--ink-3);line-height:1.5}
.bh-sec{display:flex;align-items:center;gap:8px;margin:16px 0 6px}
.bh-sec-name{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}
.bh-sec .rule{flex:1;height:1px;background:var(--line-soft)}
.bh-sec-pct{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-2);
}
.bh-note{
  margin:0 0 13px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.05em;color:var(--ink-3);
}
.bh-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.bh-label{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip{flex:none;display:flex;gap:2px;width:112px;height:18px}
.strip i{
  flex:1;min-width:0;border-radius:2px;background:var(--line-soft);
  position:relative;overflow:hidden;
}
.strip i span{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:2px}
.bh-pct{
  flex:none;width:34px;text-align:right;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);
}

/* ---------- analytics page ---------- */
.log-more{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;margin-top:15px;padding:11px 12px;
  border:1px solid var(--line-soft);border-radius:10px;background:none;cursor:pointer;
  font-size:13.5px;font-weight:500;color:var(--ink-2);
}
.log-more:hover{border-color:var(--ink-3);color:var(--ink)}
.log-more svg{width:14px;height:14px;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 18px}
.tile{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  box-shadow:var(--shadow);padding:13px 8px;text-align:center;
}
.tile b{
  display:block;line-height:1.1;font-weight:500;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent);
}
.tile span{
  display:block;margin-top:6px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
}
.card{
  padding:16px;margin-bottom:16px;
  border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surface);
}
.chart{display:flex;align-items:flex-end;margin-bottom:9px}
.chart .day{gap:0;min-width:0}
.chart .bar{height:62px;border-radius:4px}
.chart .bar span{border-radius:4px}
.span-note{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.06em;color:var(--ink-3);text-align:center;
}
.wk{display:flex;align-items:center;gap:10px;padding:5px 0}
.wk-name{
  flex:none;width:32px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
}
.wk-track{display:block;flex:1;height:9px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.wk-fill{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s cubic-bezier(.4,0,.2,1)}
.wk-pct{
  flex:none;width:34px;text-align:right;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);
}

/* ---------- edit mode ---------- */
.erow{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;border-top:1px solid var(--line-soft)}
.rows .erow:first-child{border-top:0}
.erow input{
  flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:9px;padding:9px 10px;font-size:15px;
}
.erow input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.mini{
  flex:none;width:32px;height:32px;display:grid;place-items:center;
  background:none;border:1px solid transparent;border-radius:8px;color:var(--ink-3);cursor:pointer;
}
.mini:hover{color:var(--ink);background:var(--surface-2)}
.mini.del:hover{color:var(--danger)}
.mini svg{width:15px;height:15px}
.mini[disabled]{opacity:.25;cursor:default}

/* the grab handle, and the tile while it is off the ground */
.grip{
  flex:none;width:30px;height:38px;margin-left:-4px;
  display:grid;place-items:center;
  background:none;border:1px solid transparent;border-radius:8px;
  color:var(--ink-3);cursor:grab;
  touch-action:none;-webkit-user-select:none;user-select:none;
}
.grip:hover{color:var(--ink-2);background:var(--surface-2)}
.grip svg{width:16px;height:16px;pointer-events:none}
.erow.lift{
  position:relative;z-index:5;
  background:var(--surface);border-top-color:transparent;border-radius:12px;
  box-shadow:var(--lift);
}
.erow.lift + .erow{border-top-color:transparent}
.erow.lift .grip{color:var(--ink-2);cursor:grabbing;background:none}
.sec .rows:empty{min-height:14px}
body.dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
body.dragging .erow input{pointer-events:none}
.add{
  display:flex;align-items:center;gap:9px;width:100%;padding:12px 16px;
  border:0;border-top:1px dashed var(--line);background:none;cursor:pointer;
  font-size:14.5px;color:var(--accent);font-weight:500;
}
.add svg{width:15px;height:15px}
.sec-head input{
  flex:1;min-width:0;background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;
  padding:6px 9px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;
}
.qedit{
  width:100%;margin:18px 0 22px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:10px;padding:11px 12px;font-style:italic;color:var(--ink-2);
  font-size:14.5px;line-height:1.5;resize:vertical;min-height:64px;
}

/* ---------- standing scratch pad ---------- */
.dnote{margin:4px 0 2px}
.dnote-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:44px;margin:0 0 2px;
}
.dnote-head label{
  margin:0 0 0 2px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}
.dnote .copy{
  flex:none;background:none;border:0;cursor:pointer;
  min-height:44px;padding:0 8px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}
.dnote .copy:hover{color:var(--ink)}
.dnote textarea{
  display:block;width:100%;min-height:54px;
  padding:12px 13px;resize:none;overflow:hidden;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;
  font-size:14.5px;line-height:1.45;color:var(--ink);
}
.dnote textarea::placeholder{color:var(--ink-3);font-style:italic}
.dnote textarea:focus{outline:none;border-color:var(--accent)}

.tools{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-size:14.5px;font-weight:500;
}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--ink-3)}
.btn.ghost{color:var(--ink-2);background:none}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}

<script>

/* ---------- home-screen chrome ---------- */
[["apple-mobile-web-app-capable","yes"],

var DEFAULT={
  v:3,
  quote:"",
  midQuote:"",
  sections:[
    {id:uid(),icon:"sun",title:"Morning",items:[
      "Make bed","Brush teeth","Stretch","Workout","Shower","Breakfast & water"
    ].map(function(t){return {id:uid(),label:t};})},
    {id:uid(),icon:"moon",title:"Evening",items:[
      "Brush teeth","Stretch","Read","Plan tomorrow"
    ].map(function(t){return {id:uid(),label:t};})}
  ],
  log:{},
  scratch:"",
  mtime:0
};

/* Standing questions for the two quote slots. Personal lines on the document
   join the rotation; this list is the same on every device. */
var LESSONS=[
  "Is this decision reversible? If it is, have a bias toward action \u2014 most decisions are.",
  "Instead of asking how to succeed, ask how you could fail \u2014 and avoid that.",
  "What game are you playing \u2014 wealth, mystery, or legacy? Different games demand different moves.",
  "What's the worst that could happen? Realizing that is how you plan.",

/* ---------- load local doc ---------- */
/* v3 turns each logged day from a flat map of ticked ids into { d, n, note }.
   `n` is how many habits the list held that day. Without it every day is scored
   against today's list, so adding a habit this morning quietly rewrites the past
   - a 6/6 Tuesday becomes 6/7 and breaks a streak nobody actually broke. */
function itemsOf(doc){
  return (doc.sections||[]).reduce(function(a,s){ return a.concat(s.items||[]); },[]);
}
function migrate(doc){
  if(!doc||!doc.sections) return doc;
  if(!doc.log) doc.log={};

    var n=itemsOf(doc).length;

      var rec=doc.log[k];

/* ---------- lists: meals and groceries ----------

var LIST_KEYS=["groceries","meals"];
var MEAL_FIELDS=[
  {k:"main",label:"Main"},{k:"side",label:"Veg & nuts"},{k:"fruit",label:"Fruit"},{k:"drink",label:"Drink"}
];
var WEEKDAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
/* a generic starter set; the owner's real options arrive by import, never in this file */
var MEAL_SEED={
  main:[["Oatmeal","Breakfast"],["Eggs","Breakfast"],["Chicken","Meat"],["Salmon","Fish"],["Pasta","Pasta"]],
  side:[["Broccoli","Vegetable"],["Carrots","Vegetable"],["Rice","Starch"],["Potatoes","Starch"],["Almonds","Nuts"]],
  fruit:[["Apple","Fruit"],["Banana","Fruit"],["Berries","Fruit"]],
  drink:[["Water","Water"],["Milk","Dairy"],["Protein shake","Protein"]]

function seedOptions(){
  var o={};
  MEAL_FIELDS.forEach(function(f){
    o[f.k]=MEAL_SEED[f.k].map(function(x){ return {name:x[0],type:x[1]}; });
  });
  return o;

/* Fill in whatever a document is missing. Run on local state only - never on a
   remote copy before merging, or the empty defaults would look like real data. */
function shapeLists(doc){
  if(!doc) return doc;
  if(!doc.groceries||!Array.isArray(doc.groceries.items)) doc.groceries={items:[],mtime:0};
  if(!doc.meals||typeof doc.meals!=="object") doc.meals={slots:null,options:null,plan:{},mtime:0};
  var m=doc.meals;
  if(!Array.isArray(m.slots)||!m.slots.length) m.slots=["Breakfast","Lunch","Dinner"];
  if(!m.options||typeof m.options!=="object") m.options=seedOptions();
  MEAL_FIELDS.forEach(function(f){ if(!Array.isArray(m.options[f.k])) m.options[f.k]=[]; });
  if(!m.plan||typeof m.plan!=="object") m.plan={};
  return doc;
}

var state;
try{ state=JSON.parse(lsGet(KEY)||"null"); }catch(e){ state=null; }
if(!state) state=JSON.parse(JSON.stringify(DEFAULT));
if(!state.log) state.log={};
if(!state.mtime) state.mtime=0;
if(typeof state.midQuote!=="string") state.midQuote="";
/* stamp the migration down straight away, so the day counts it freezes are the
   ones this device sees now and not whatever the list has grown into by the
   first edit. Not a user edit, so mtime stays where it is. */
var wasV=state.v;
migrate(state);
if(state.v!==wasV) saveLocal();
shapeLists(state);
var editing=false;

/* ---------- sync config ---------- */
var cfg=null;
try{ cfg=JSON.parse(lsGet(CFGKEY)||"null"); }catch(e){ cfg=null; }

/* a half-finished setup: project reached, secret key still to be typed */
var pending=null;
try{ pending=JSON.parse(lsGet(PENDKEY)||"null"); }catch(e){ pending=null; }

/* a setup link carries the project, never the secret key. older links carried
   the key too - still honoured, so devices set up before this change keep
   working until the key is rotated. */
var ASKPEND="routines.askPending";
(function readServerHash(){
  var m=/[#&]c=([A-Za-z0-9_\-]+)/.exec(location.hash||"");
  if(!m) return;
  try{
    var next=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))));
    if(next.u&&/^https:\/\//.test(next.u)) lsSet(ASKPEND,next.u);
    history.replaceState(null,"",location.pathname+location.search);
  }catch(e){}
})();
(function readHash(){
  var m=/[#&]s=([A-Za-z0-9_\-]+)/.exec(location.hash||"");
  if(!m) return;
  try{
    var json=decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/"))));
    var next=JSON.parse(json);
    if(!next.url||!next.anon) return;
    if(next.key){
      cfg={url:next.url,anon:next.anon,key:next.key};
      lsSet(CFGKEY,JSON.stringify(cfg));
      pending=null; lsDel(PENDKEY);
    }else if(!cfg){
      pending={url:next.url,anon:next.anon};
      lsSet(PENDKEY,JSON.stringify(pending));
    }
    history.replaceState(null,"",location.pathname+location.search);
  }catch(e){}
})();

function setupLink(){
  if(askCfg){
    var c=btoa(unescape(encodeURIComponent(JSON.stringify({u:askCfg.url}))))
          .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    return location.origin+location.pathname+"#c="+c;
  }
  if(!cfg) return "";
  var b=btoa(unescape(encodeURIComponent(JSON.stringify({url:cfg.url,anon:cfg.anon}))))
        .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return location.origin+location.pathname+"#s="+b;
}

var sync={state:"off",msg:"Local only",at:0};
function setSync(s,msg){ sync.state=s; sync.msg=msg; paintChip(); }

function rpc(fn,body){
  /* Through the Routines server: it holds the Supabase details and the row's key, so
     this device sends only its server key and the document. */
  if(cfg.via==="server"){
    return fetch(cfg.url+"/api/doc",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},
      body:JSON.stringify(fn==="routines_get"?{op:"get"}:{op:"put",d:body.d})
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        if(!r.ok) throw new Error(d.error||("Routines server "+r.status));
        return fn==="routines_get"?(d.doc||null):null;
      });
    });
  }
  var base=String(cfg.url).replace(/\/+$/,"");
  return fetch(base+"/rest/v1/rpc/"+fn,{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":cfg.anon,"Authorization":"Bearer "+cfg.anon},
    body:JSON.stringify(body)
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+" "+t.slice(0,140)); });
    return r.text().then(function(t){ return t?JSON.parse(t):null; });
  });
}

function mergeDocs(local,remote){
  if(!remote||!remote.sections) return local;
  var newer=(remote.mtime||0)>(local.mtime||0)?remote:local;
  var older=newer===remote?local:remote;
  var out=JSON.parse(JSON.stringify(newer));
  out.log=Object.assign({},older.log||{},newer.log||{});
  /* Older builds have no scratch field. A newer mtime from one of those would
     otherwise blank a pad this device already holds. */
  if(typeof out.scratch!=="string")
    out.scratch=typeof older.scratch==="string"?older.scratch:"";
  /* Groceries and meals each carry their own mtime and merge on it, not on the
     document's. A habit ticked offline on one device must not roll back a grocery
     list edited on another, and an older build that has never seen these fields
     must not erase them. */
  LIST_KEYS.forEach(function(k){
    var a=local[k], b=remote[k];
    var pick = !a ? b : !b ? a : ((b.mtime||0)>(a.mtime||0) ? b : a);
    if(pick) out[k]=JSON.parse(JSON.stringify(pick));
  });
  return out;
}

var pushTimer=null, pulling=false;
function schedulePush(){
  if(!cfg) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(push,1200);
}
function push(){
  if(!cfg) return Promise.resolve();
  setSync("busy","Saving…");
  return rpc("routines_put",{k:cfg.key,d:state}).then(function(){
    setSync("ok","Synced");
  }).catch(function(err){
    setSync("err","Sync error");
    sync.detail=String(err.message||err);
  });
}
function pull(){
  if(!cfg||pulling) return Promise.resolve();
  pulling=true;
  setSync("busy","Syncing…");
  return rpc("routines_get",{k:cfg.key}).then(function(remote){
    /* Nothing stored under this key is expected exactly once - on the device that
       minted it. Anywhere else it means the key is not the one holding the list,
       and it was the push right here that used to turn that mistake into a second
       row and still report "Synced". Say so, and send nothing. */
    if(!remote||!remote.sections){
      /* Through the server, an empty row means no device has saved yet - a wrong key
         is refused outright - so this device's list goes up. */
      if(!cfg.mint&&cfg.via!=="server"){
        setSync("err","No list on that key");
        sync.detail="Nothing is stored under this secret key, so nothing was uploaded from here. Check it matches the device that has your list, character for character.";
        return;
      }
      if(cfg.via!=="server"){ delete cfg.mint; lsSet(CFGKEY,JSON.stringify(cfg)); }
      setSync("ok","Synced");
      return push();
    }
    var before=JSON.stringify(state);
    state=shapeLists(mergeDocs(state,migrate(remote)));
    saveLocal();
    markClean();
    if(JSON.stringify(state)!==before) render();
    setSync("ok","Synced");
    if((state.mtime||0)>(remote.mtime||0)) return push();
  }).catch(function(err){
    setSync("err","Sync error");
    sync.detail=String(err.message||err);
  }).then(function(){ pulling=false; });
}

function saveLocal(){ lsSet(KEY,JSON.stringify(state)); }

/* automatic local snapshots, taken just before a structural edit */
var SNAPKEY="routines.snaps", SNAPMAX=20, SNAPGAP=90000;
function stamp(t){
  var d=new Date(t), M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var hh=String(d.getHours()).padStart(2,"0"), mm=String(d.getMinutes()).padStart(2,"0");
  return (keyOf(nowDay(d))===today()? "Today" : M[d.getMonth()]+" "+d.getDate())+" "+hh+":"+mm;
}
function snapshots(){ try{ return JSON.parse(lsGet(SNAPKEY)||"[]"); }catch(e){ return []; } }
function structOf(s){ return JSON.stringify({q:s.quote,m:s.midQuote,sec:s.sections}); }
var prevDoc=null, prevStruct=null;
function markClean(){ prevDoc=JSON.stringify(state); prevStruct=structOf(state); }
function snapshotPush(body){
  var list=snapshots();
  if(list.length && (Date.now()-list[0].t)<SNAPGAP) return;
  if(list.length && list[0].body===body) return;
  list.unshift({t:Date.now(),body:body});
  if(list.length>SNAPMAX) list.length=SNAPMAX;
  lsSet(SNAPKEY,JSON.stringify(list));
}
function save(){
  var st=structOf(state);
  if(prevStruct!==null && st!==prevStruct && prevDoc) snapshotPush(prevDoc);
  state.mtime=Date.now(); saveLocal(); schedulePush();
  markClean();
}

/* ---------- dates ---------- */
function keyOf(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
/* The day runs until 2:00am local, so a late night still belongs to yesterday.
   Pass a Date to read some other moment the same way; omit it for now. */
var RESET_HOUR=2;
function nowDay(from){
  var d=from? new Date(from.getTime()) : new Date();
  if(d.getHours()<RESET_HOUR) d.setDate(d.getDate()-1);
  return d;
}
function today(){ return keyOf(nowDay()); }
/* Days since a fixed local origin, so the quote pair is stable for a civil
   day and the same on every device looking at that date. */
function dayIndex(k){
  var p=(k||today()).split("-");
  return Math.round((new Date(+p[0],+p[1]-1,+p[2])-new Date(2020,0,1))/864e5);
}
var day=today();
if(typeof state.scratch!=="string") state.scratch=noteOn(day)||"";

function allItems(){ return itemsOf(state); }
/* Today is still moving, so it scores against the list as it stands. A day that
   is over scores against the list as it stood - every tick it holds counts,
   including ticks for habits since deleted, because the day was whole then. */
function doneOn(k){
  var rec=state.log[k], items=allItems(), n=0;
  if(!rec) return {done:0,total:items.length};
  var d=rec.d||{};
  if(k===today()||typeof rec.n!=="number"){
    items.forEach(function(it){ if(d[it.id]) n++; });
    return {done:n,total:items.length};
  }
  n=Object.keys(d).length;
  return {done:n,total:Math.max(rec.n,n)};
}
function pctOn(k){ var d=doneOn(k); return d.total? d.done/d.total : 0; }
function isDone(id){ return isDoneOn(day,id); }
function isDoneOn(k,id){ return !!(state.log[k]&&state.log[k].d&&state.log[k].d[id]); }
function noteOn(k){ var rec=state.log[k]; return (rec&&rec.note)||""; }
var STREAK_MIN=3;
function itemStreak(id){
  var n=0, cursor=nowDay();
  if(!isDoneOn(today(),id)) cursor.setDate(cursor.getDate()-1);
  for(var g=0;g<400;g++){
    if(isDoneOn(keyOf(cursor),id)){ n++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return n;
}
function logStart(){
  var ks=Object.keys(state.log).sort();
  return ks.length? ks[0] : today();
}
/* Days from the first logged day up to today, at most n back. n=0 means all of it.
   Clipped at the start so a week-old log doesn't read 25% against a 30-day window. */
function rangeKeys(n){
  var start=logStart(), out=[], cursor=nowDay(), lim=n||4000;
  while(out.length<lim && out.length<4000){
    var k=keyOf(cursor);
    if(k<start) break;
    out.push(k);
    cursor.setDate(cursor.getDate()-1);
  }
  return out.reverse();
}
function itemStats(id,keys){
  var n=0;
  keys.forEach(function(k){ if(isDoneOn(k,id)) n++; });
  return {done:n,total:keys.length,pct:keys.length? n/keys.length : 0};
}
function namedItems(sec){
  return sec.items.filter(function(it){ return it.label.trim()!==""; });
}
/* iOS has no web haptics API of any kind, so this reaches Android and desktop
   only. It costs one line and does nothing anywhere it isn't supported. */
function buzz(pattern){
  if(!navigator.vibrate) return;
  try{ navigator.vibrate(pattern); }catch(e){}
}

/* Today's record follows the list while the day is live: ticks belonging to a
   habit that was just deleted go with it, and the count is kept current so the
   day freezes at the right denominator when 2:00am rolls it into the log. */
function touchToday(){
  var rec=state.log[day];
  if(!rec) return;
  var live={}, has={};
  allItems().forEach(function(it){ has[it.id]=1; });
  Object.keys(rec.d||{}).forEach(function(id){ if(has[id]) live[id]=1; });
  rec.d=live;
  rec.n=allItems().length;
  if(!Object.keys(live).length && !(rec.note||"").trim()) delete state.log[day];
}
function dayRec(){
  var rec=state.log[day];
  if(!rec) rec=state.log[day]={d:{},n:allItems().length};
  if(!rec.d) rec.d={};
  return rec;
}
function toggle(id){
  var rec=dayRec();
  if(rec.d[id]) delete rec.d[id];
  else rec.d[id]=1;
  touchToday();
  save();
  buzz(pctOn(day)>=1? [14,55,14] : 9);
}
function setScratch(text){
  state.scratch=text;
  save();
}

var $=function(id){ return document.getElementById(id); };

/* icon + label + optional status + disclosure chevron */
function summaryRow(iconKey,text,status){
  var sum=document.createElement("summary");
  sum.innerHTML=ICON[iconKey]+'<span class="sum-label"></span>';
  sum.querySelector(".sum-label").textContent=text;
  if(status){
    var st=document.createElement("span");
    st.className="sstat"+(status.tone?" "+status.tone:"");
    st.innerHTML="<i></i>";
    var sl=document.createElement("span"); sl.textContent=status.text;
    st.appendChild(sl);
    sum.appendChild(st);
  }
  var ch=document.createElement("span");
  ch.className="chev"; ch.innerHTML=ICON.down;
  sum.appendChild(ch);
  return sum;
}

/* ---------- render ---------- */
function statusTone(){
  return sync.state==="ok"?"ok":sync.state==="err"?"err":sync.state==="busy"?"busy":"";
}
function paintChip(){
  var c=$("chip");
  c.className="chip"+(statusTone()?" "+statusTone():"");
  $("chipText").textContent=sync.msg;
  Array.prototype.forEach.call(document.querySelectorAll("#syncPanel .sstat, #serverPanel .sstat"),function(ss){
    ss.className="sstat"+(statusTone()?" "+statusTone():"");
    ss.lastChild.textContent=sync.msg;
  });
}

function renderHeader(){
  var d=nowDay();
  $("date").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
  var t=doneOn(day);
  $("fill").style.width=(t.total? (t.done/t.total*100):0)+"%";
  $("count").innerHTML="<b>"+t.done+"</b> / "+t.total;
  paintChip();
}

function quotePool(){
  var seen={}, pool=[], i;
  function add(s){
    s=(s||"").trim();
    if(!s||seen[s]) return;
    seen[s]=1;
    pool.push(s);
  }
  for(i=0;i<LESSONS.length;i++) add(LESSONS[i]);
  add(state.quote);
  add(state.midQuote);
  return pool;
}
function rotated(slot){
  var pool=quotePool(), n=pool.length;
  if(!n) return "";
  var i=dayIndex(today())+(slot? Math.max(1, Math.floor(n/2)) : 0);
  return pool[((i%n)+n)%n];
}

function renderQuote(){
  var host=$("quoteHost");
  host.innerHTML="";
  if(editing){
    var ta=document.createElement("textarea");
    ta.className="qedit"; ta.value=state.quote; ta.placeholder="A line of yours \u2014 it joins the daily rotation";
    ta.setAttribute("aria-label","Daily reminder");
    ta.addEventListener("input",function(){ state.quote=ta.value; save(); });
    host.appendChild(ta);
    var hint=document.createElement("p");
    hint.className="qhint";
    hint.textContent="Your two lines rotate each day with a few standing questions.";
    host.appendChild(hint);
  }else{
    var line=rotated(0);
    if(!line) return;
    var p=document.createElement("p");
    p.className="quote"; p.textContent=line;
    host.appendChild(p);
  }
}

function interlude(){
  if(editing){
    var ta=document.createElement("textarea");
    ta.className="qedit mid"; ta.value=state.midQuote;
    ta.placeholder="A line between sections \u2014 also in the rotation";
    ta.setAttribute("aria-label","Mid-day reminder");
    ta.addEventListener("input",function(){ state.midQuote=ta.value; save(); });
    return ta;
  }
  var w=document.createElement("div");
  var line=rotated(1);
  if(!line){ w.style.height="4px"; return w; }
  w.className="interlude";
  w.innerHTML='<span class="rule"></span><p></p><span class="rule"></span>';
  w.querySelector("p").textContent=line;
  return w;
}

function renderSections(){
  var host=$("sections");
  host.innerHTML="";
  state.sections.forEach(function(sec,si){
    var card=document.createElement("div"); card.className="sec";
    var head=document.createElement("div"); head.className="sec-head";
    head.innerHTML=ICON[sec.icon]||ICON.sun;
    if(editing){
      var ti=document.createElement("input");
      ti.value=sec.title; ti.setAttribute("aria-label","Section name");
      ti.addEventListener("input",function(){ sec.title=ti.value; save(); });
      head.appendChild(ti);
      var sdel=document.createElement("button");
      sdel.className="mini del"; sdel.type="button"; sdel.title="Delete section"; sdel.innerHTML=ICON.trash;
      sdel.addEventListener("click",function(){
        if(confirm("Delete the "+(sec.title||"untitled")+" section and its items?")){
          state.sections.splice(si,1); save(); render();
        }
      });
      head.appendChild(sdel);
    }else{
      var h=document.createElement("div"); h.className="sec-title"; h.textContent=sec.title;
      head.appendChild(h);
      var c=document.createElement("div"); c.className="sec-count";
      c.textContent=sec.items.filter(function(it){ return isDone(it.id); }).length+"/"+sec.items.length;
      head.appendChild(c);
    }
    card.appendChild(head);

    var rows=document.createElement("div"); rows.className="rows";
    rows._sec=sec;   /* a dragged tile is filed back by the host it lands in */
    sec.items.forEach(function(it){ rows.appendChild(editing? editRow(it) : checkRow(it)); });
    card.appendChild(rows);

    if(editing){
      var add=document.createElement("button");
      add.className="add"; add.type="button";
      add.innerHTML=ICON.plus+"<span>Add item</span>";
      add.addEventListener("click",function(){
        sec.items.push({id:uid(),label:""}); save(); render();
        var host2=document.getElementById("sections");
        var inputs=host2.children[si].querySelectorAll(".erow input");
        if(inputs.length) inputs[inputs.length-1].focus();
      });
      card.appendChild(add);
    }
    host.appendChild(card);
    if(si===0) host.appendChild(interlude());
  });
}

function checkRow(it){
  var b=document.createElement("button");
  b.className="row"; b.type="button";
  b.setAttribute("aria-pressed", isDone(it.id)?"true":"false");
  b.innerHTML='<span class="box">'+ICON.check+'</span><span class="label"></span><span class="hstreak"></span>';
  b.querySelector(".label").textContent=it.label;
  var hs=b.querySelector(".hstreak");
  function paintStreak(){
    var n=itemStreak(it.id);
    hs.textContent = n>=STREAK_MIN ? n+"d" : "";
    hs.title = n>=STREAK_MIN ? n+" days in a row" : "";
  }
  paintStreak();
  b.addEventListener("click",function(){
    toggle(it.id);
    b.setAttribute("aria-pressed", isDone(it.id)?"true":"false");
    paintStreak();
    renderHeader(); renderLog();
    var card=b.closest(".sec"), cnt=card.querySelector(".sec-count");
    if(cnt){
      var sec=state.sections.filter(function(s){ return s.items.some(function(x){return x.id===it.id;}); })[0];
      if(sec) cnt.textContent=sec.items.filter(function(x){ return isDone(x.id); }).length+"/"+sec.items.length;
    }
  });
  return b;
}

function editRow(it){
  var r=document.createElement("div"); r.className="erow";
  r._item=it;

  var grip=document.createElement("button");
  grip.className="grip"; grip.type="button"; grip.innerHTML=ICON.grip;
  grip.title="Drag to reorder \u2014 or use the arrow keys";
  grip.setAttribute("aria-label","Reorder "+(it.label||"this habit"));
  grip.addEventListener("pointerdown",function(e){ startDrag(e,r); });
  grip.addEventListener("dragstart",function(e){ e.preventDefault(); });
  grip.addEventListener("keydown",function(e){
    if(e.key==="ArrowUp"){ e.preventDefault(); nudge(it,-1); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); nudge(it,1); }
  });
  r.appendChild(grip);

  var inp=document.createElement("input");
  inp.value=it.label; inp.placeholder="New habit"; inp.setAttribute("aria-label","Habit name");
  inp.addEventListener("input",function(){ it.label=inp.value; save(); });
  r.appendChild(inp);

  /* a row can be dragged into the other section, so its home is looked up
     rather than closed over */
  var del=document.createElement("button");
  del.className="mini del"; del.type="button"; del.innerHTML=ICON.trash; del.title="Delete";
  del.addEventListener("click",function(){
    var sec=sectionOf(it); if(!sec) return;
    var i=sec.items.indexOf(it);
    if(i<0) return;
    sec.items.splice(i,1); save(); render();
  });
  r.appendChild(del);
  return r;
}

/* ---------- drag to reorder ---------- */
/* The tile is moved in the DOM while the finger travels, so the gap opens
   exactly where it will land and a drop into the other section moves it
   there. The item arrays are rebuilt from that DOM order once, on drop. */
var drag=null;

function rowHosts(){ return [].slice.call(document.querySelectorAll("#sections .rows")); }

function sectionOf(it){
  for(var i=0;i<state.sections.length;i++){
    if(state.sections[i].items.indexOf(it)>=0) return state.sections[i];
  }
  return null;
}

function commitOrder(){
  rowHosts().forEach(function(host){
    if(!host._sec) return;
    var next=[];
    [].slice.call(host.children).forEach(function(el){ if(el._item) next.push(el._item); });
    host._sec.items=next;
  });
  save();
}

/* run a DOM change, then slide every row that moved from where it was.
   prefers-reduced-motion kills the transition through the global rule. */
function flip(mutate){
  var rows=[].slice.call(document.querySelectorAll("#sections .erow"));
  var was=rows.map(function(el){ return el.getBoundingClientRect().top; });
  mutate();
  rows.forEach(function(el,i){
    if(drag&&el===drag.el) return;
    var dy=was[i]-el.getBoundingClientRect().top;
    if(!dy) return;
    el.style.transition="none";
    el.style.transform="translateY("+dy+"px)";
    el.getBoundingClientRect();
    el.style.transition="transform .16s cubic-bezier(.4,0,.2,1)";
    el.style.transform="";
  });
}

/* the section the finger is over, or the nearest one when it is in the gap */
function hostAt(y){
  var best=null, bestD=Infinity;
  rowHosts().forEach(function(h){
    var r=h.getBoundingClientRect();
    var d = y<r.top ? r.top-y : (y>r.bottom ? y-r.bottom : 0);
    if(d<bestD){ bestD=d; best=h; }
  });
  return best;
}

function slotIn(host,y){
  var kids=[].slice.call(host.children), i, r;
  for(i=0;i<kids.length;i++){
    if(kids[i]===drag.el) continue;
    r=kids[i].getBoundingClientRect();
    if(y < r.top + r.height/2) return kids[i];
  }
  return null;
}

/* reseat the tile in the list, then park it back under the finger */
function place(){
  var el=drag.el, host=hostAt(drag.y);
  if(host){
    var before=slotIn(host,drag.y);
    if(host!==el.parentNode || before!==el.nextSibling){
      flip(function(){ host.insertBefore(el,before); });
    }
  }
  el.style.transform="";
  el.style.transform="translateY("+((drag.y-drag.grab)-el.getBoundingClientRect().top)+"px)";
}

/* the list is taller than the phone, so dragging near an edge walks the page */
function edgeScroll(){
  if(!drag) return;
  var pad=96, step=0;
  if(drag.y<pad) step=-Math.ceil((pad-drag.y)/5);
  else if(drag.y>window.innerHeight-pad) step=Math.ceil((drag.y-(window.innerHeight-pad))/5);
  if(step){
    var y0=window.pageYOffset;
    window.scrollBy(0,step);
    if(window.pageYOffset!==y0) place();
  }
  drag.raf=requestAnimationFrame(edgeScroll);
}

function onDragMove(e){
  if(!drag||e.pointerId!==drag.id) return;
  e.preventDefault();
  if(Math.abs(e.clientY-drag.y0)>2) drag.moved=true;
  drag.y=e.clientY;
  place();
}

function onDragEnd(e){
  if(!drag||(e&&e.pointerId!==drag.id)) return;
  stopDrag(drag.moved);
}

/* commit only when the tile actually travelled - a tap on the handle is not
   an edit, and saving one would push it to the other devices for nothing */
function stopDrag(commit){
  if(!drag) return;
  var el=drag.el, live=$("sections").contains(el);
  cancelAnimationFrame(drag.raf);
  document.removeEventListener("pointermove",onDragMove);
  document.removeEventListener("pointerup",onDragEnd);
  document.removeEventListener("pointercancel",onDragEnd);
  document.body.classList.remove("dragging");
  el.classList.remove("lift");
  el.style.transition=""; el.style.transform="";
  drag=null;
  if(commit&&live) commitOrder();
}

function startDrag(e,el){
  if(drag||e.button) return;
  drag={el:el,id:e.pointerId,y:e.clientY,y0:e.clientY,grab:e.clientY-el.getBoundingClientRect().top,raf:0,moved:false};
  el.classList.add("lift");
  document.body.classList.add("dragging");
  document.addEventListener("pointermove",onDragMove,{passive:false});
  document.addEventListener("pointerup",onDragEnd);
  document.addEventListener("pointercancel",onDragEnd);
  drag.raf=requestAnimationFrame(edgeScroll);
  place();
  buzz(6);
}

/* the handle keeps the keyboard path the arrow buttons used to provide */
function nudge(it,d){
  var sec=sectionOf(it); if(!sec) return;
  var i=sec.items.indexOf(it), j=i+d;
  if(j<0||j>=sec.items.length) return;
  sec.items[i]=sec.items[j]; sec.items[j]=it;
  save(); render();
  var rows=[].slice.call(document.querySelectorAll("#sections .erow")), k;
  for(k=0;k<rows.length;k++){
    if(rows[k]._item===it){ rows[k].querySelector(".grip").focus(); break; }
  }
}

function copy(ta,btn,restore){
  var done=function(){ btn.textContent="Copied"; setTimeout(function(){ btn.textContent=restore; },1400); };
  try{
    navigator.clipboard.writeText(ta.value).then(done,function(){ legacy(); });
  }catch(e){ legacy(); }
  function legacy(){
    var was=ta.readOnly;
    ta.removeAttribute("readonly"); ta.select(); ta.setSelectionRange(0,999999);
    try{ document.execCommand("copy"); done(); }catch(e){ btn.textContent="Select the text and copy"; }
    ta.readOnly=was;
  }
}

var RANGES=[
  {label:"14d",title:"Last 14 days",n:14},
  {label:"30d",title:"Last 30 days",n:30},
  {label:"All",title:"All time",n:0}
];
var rangeIdx=1;
var openDay=null;
var view="list";

function fmtDay(k,long){
  var d=new Date(k+"T12:00:00");   /* noon: never let a timezone shove this onto the day before */
  return d.toLocaleDateString(undefined, long
    ? {weekday:"long",month:"short",day:"numeric"}
    : {month:"short",day:"numeric"});
}
function curStreak(){
  var n=0, cursor=nowDay();
  if(pctOn(today())<1) cursor.setDate(cursor.getDate()-1);
  for(var g=0;g<400;g++){
    if(pctOn(keyOf(cursor))>=1){ n++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return n;
}
function bestStreak(){
  var best=0, run=0;
  rangeKeys(0).forEach(function(k){
    if(pctOn(k)>=1){ run++; if(run>best) best=run; } else run=0;
  });
  return best;
}
function rangePct(keys){
  var done=0, total=0;
  keys.forEach(function(k){ var t=doneOn(k); done+=t.done; total+=t.total; });
  return total? done/total : 0;
}
function weekdayPct(keys){
  var sums=[0,0,0,0,0,0,0], counts=[0,0,0,0,0,0,0];
  keys.forEach(function(k){
    var wd=new Date(k+"T12:00:00").getDay();
    sums[wd]+=pctOn(k); counts[wd]++;
  });
  return sums.map(function(sum,i){ return counts[i]? sum/counts[i] : 0; });
}

function bars(keys,showDow){
  var dows=["S","M","T","W","T","F","S"], out="";
  keys.forEach(function(k){
    var p=Math.round(pctOn(k)*100);
    out+='<button class="day'+(k===today()?" today":"")+'" type="button" data-day="'+k+'"'+
      ' aria-pressed="'+(openDay===k?"true":"false")+'"'+
      ' title="'+k+' — '+p+'%">'+
      '<span class="bar"><span style="height:'+p+'%"></span></span>'+
      (showDow? '<span class="dow">'+dows[new Date(k+"T12:00:00").getDay()]+'</span>' : "")+
      '</button>';
  });
  return out;
}

/* One day, opened from a bar in the chart. */
function dayDetail(k){
  var t=doneOn(k);
  var h='<div class="daydetail"><div class="dd-top">'+
    '<div class="dd-date">'+esc(fmtDay(k,true))+'</div>'+
    '<div class="dd-count">'+t.done+'/'+t.total+'</div></div>';
  state.sections.forEach(function(sec){
    var items=namedItems(sec);
    if(!items.length) return;
    h+='<div class="dd-sec">'+esc(sec.title)+'</div>';
    items.forEach(function(it){
      h+='<div class="dd-item'+(isDoneOn(k,it.id)?" on":"")+'">'+
        '<span class="dd-mark">'+ICON.check+'</span><span>'+esc(it.label)+'</span></div>';
    });
  });

    h+='<p class="dd-changed">The list has changed since then \u2014 '+t.total+
      ' habit'+(t.total===1?"":"s")+' that day.</p>';

}

/* Every habit, with its own strip and its own rate over the chosen window. */
/* A long range would put 200 hairlines in 112px. Bucket it instead: at most 14
   bars, each the completion rate across the days it covers. The odd-sized bucket
   goes on the left, so the newest bars always mean the same thing. */
function strips(keys){
  var n=keys.length, count=Math.min(14,n), groups=[], i;
  for(i=0;i<count;i++){
    groups.push(keys.slice(Math.floor(i*n/count), Math.floor((i+1)*n/count)));
  }
  return groups;
}
/* Buckets can differ by a day, so say "4-5 days" rather than pick one and lie. */
function stripNote(groups){
  var lo=Infinity, hi=0;
  groups.forEach(function(g){
    if(g.length<lo) lo=g.length;
    if(g.length>hi) hi=g.length;
  });
  if(hi<=1) return "One bar per day";
  return "One bar per "+(lo===hi? hi : lo+"–"+hi)+" days";
}

function byHabit(keys){
  var h="";
  if(!keys.length || !Object.keys(state.log).length || !allItems().length){
    return '<p class="bh-empty">Nothing logged yet — check something off and the numbers start here.</p>';
  }
  var groups=strips(keys);
  var stripTitle=esc(stripNote(groups).toLowerCase());
  state.sections.forEach(function(sec){
    var items=namedItems(sec);
    if(!items.length) return;
    var done=0, total=0;
    items.forEach(function(it){ var st=itemStats(it.id,keys); done+=st.done; total+=st.total; });
    h+='<div class="bh-sec"><span class="bh-sec-name">'+esc(sec.title)+'</span>'+
      '<span class="rule"></span><span class="bh-sec-pct">'+
      (total? Math.round(done/total*100):0)+'%</span></div>';
    items.forEach(function(it){
      var st=itemStats(it.id,keys), cells="";
      groups.forEach(function(g){
        var n=0;
        g.forEach(function(k){ if(isDoneOn(k,it.id)) n++; });
        cells+='<i><span style="height:'+Math.round(n/g.length*100)+'%"></span></i>';
      });
      h+='<div class="bh-row"><span class="bh-label">'+esc(it.label)+'</span>'+
        '<span class="strip" title="'+stripTitle+'">'+cells+'</span>'+
        '<span class="bh-pct" title="'+st.done+' of '+st.total+' day'+(st.total===1?"":"s")+'">'+
        Math.round(st.pct*100)+'%</span></div>';
    });
  });
  return '<p class="bh-note">'+esc(
      stripNote(groups)+"  ·  "+fmtDay(keys[0])+" → "+fmtDay(keys[keys.length-1])
    )+'</p>'+h;
}

/* The compact card at the bottom of the list. Tapping any of it opens the full page. */
function renderLog(){

/* The whole analytics page. One range control drives everything on it. */
function renderStats(){
  var r=RANGES[rangeIdx], keys=rangeKeys(r.n);
  var gap = keys.length>40 ? 1.5 : keys.length>20 ? 3 : 6;
  var h='<div class="tiles">'+
    '<div class="tile"><b>'+curStreak()+'</b><span>day streak</span></div>'+
    '<div class="tile"><b>'+bestStreak()+'</b><span>best ever</span></div>'+
    '<div class="tile"><b>'+Math.round(rangePct(keys)*100)+'%</b><span>'+esc(r.title.toLowerCase())+'</span></div>'+
    '</div>';

  h+='<div class="card"><div class="log-head"><div class="log-title">'+esc(r.title)+'</div><div class="ranges">';
  RANGES.forEach(function(x,i){

/* A dropdown grouped by type, like the colour key in a meal sheet. A value that is
   no longer an option stays selectable, so trimming the options never blanks a plan. */
function mealSelect(field,value,onChange){
  var sel=document.createElement("select");
  sel.appendChild(new Option("—",""));
  var groups={}, order=[];
  state.meals.options[field].forEach(function(o){
    var t=o.type||"";
    if(!groups[t]){ groups[t]=[]; order.push(t); }
    groups[t].push(o.name);
  });
  var seen=false;
  order.forEach(function(t){
    var host=sel;
    if(t&&order.length>1){ host=document.createElement("optgroup"); host.label=t; sel.appendChild(host); }
    groups[t].forEach(function(n){ host.appendChild(new Option(n,n)); if(n===value) seen=true; });
  });
  if(value&&!seen) sel.appendChild(new Option(value,value));
  sel.value=value||"";
  sel.addEventListener("change",function(){ onChange(sel.value); });
  return sel;
}

function parseOptionLines(text){

/* ----- import ----------
   One paste box for three things. A grocery sheet copied from Sheets or Excel
   arrives as tab-separated rows; a CSV export as comma-separated; an import
   prepared by Claude as JSON with any of habits, groceries and meals. Nothing is
   ever deleted: matching rows update, new ones are added. */
function parseTable(text){
  var sep=text.indexOf("\t")>=0?"\t":",", rows=[], row=[], cell="", q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=ch;
    }
    else if(ch==='"'&&cell==="") q=true;
    else if(ch===sep){ row.push(cell); cell=""; }
    else if(ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(ch!=="\r") cell+=ch;
  }
  row.push(cell); rows.push(row);
  return rows.filter(function(r){ return r.some(function(c){ return c.trim(); }); });
}
function truthy(v){ return /^(true|yes|y|1|x|✓|✔)$/i.test(String(v).trim()); }
function importGroceries(list){
  var added=0, updated=0;
  list.forEach(function(g){
    var name=String(g.name||"").trim(); if(!name) return;
    var hit=findGrocery(name);
    if(!hit){ hit={id:uid(),name:name,group:"",store:"",note:"",need:false}; state.groceries.items.push(hit); added++; }
    else updated++;
    if(g.group!=null) hit.group=String(g.group).trim();
    if(g.store!=null) hit.store=String(g.store).trim();
    if(g.note!=null) hit.note=String(g.note).trim();
    if(g.need!=null) hit.need=g.need===true||truthy(g.need);
    touched(hit);
  });
  if(added||updated){ state.groceries.mtime=Date.now(); groEpoch++; }
  return {added:added,updated:updated};
}
function groceriesFromTable(rows){
  var h=-1;
  for(var i=0;i<rows.length&&h<0;i++){
    if(rows[i].some(function(c){ return /^\s*(item|name)\s*$/i.test(c); })) h=i;
  }
  if(h<0) throw new Error("Couldn't find a header row with an Item column. Copy the sheet including its header row.");
  var cols={};
  rows[h].forEach(function(c,i){
    var k=c.trim().toLowerCase();
    if(/^(item|name)$/.test(k)) cols.name=i;
    else if(/^need/.test(k)) cols.need=i;
    else if(/group|category|aisle/.test(k)) cols.group=i;
    else if(/store|shop/.test(k)) cols.store=i;
    else if(/qty|quantity|note/.test(k)) cols.note=i;
  });
  return rows.slice(h+1).map(function(r){
    var g={name:r[cols.name]};
    ["need","group","store","note"].forEach(function(k){ if(cols[k]!=null) g[k]=r[cols[k]]||""; });
    return g;
  });
}
function importHabits(sections){
  var added=0, have={};
  state.sections.forEach(function(sec){ sec.items.forEach(function(it){ have[it.label.trim().toLowerCase()]=1; }); });
  sections.forEach(function(src){
    var title=String(src.title||"").trim(); if(!title) return;
    var sec=null;
    state.sections.forEach(function(x){ if(x.title.trim().toLowerCase()===title.toLowerCase()) sec=x; });
    (src.items||[]).forEach(function(label){
      label=String(label).trim(); if(!label||have[label.toLowerCase()]) return;
      if(!sec){ sec={id:uid(),icon:src.icon==="moon"?"moon":"sun",title:title,items:[]}; state.sections.push(sec); }
      sec.items.push({id:uid(),label:label}); have[label.toLowerCase()]=1; added++;
    });
  });
  if(added) touchToday();
  return added;
}
function importMeals(src){
  var n=0;
  if(src.options) MEAL_FIELDS.forEach(function(f){
    var list=src.options[f.k]; if(!Array.isArray(list)) return;
    state.meals.options[f.k]=parseOptionLines(list.map(function(o){
      return Array.isArray(o)? o.join(", ") : (o.type? o.name+", "+o.type : String(o.name||o));
    }).join("\n"));
    n++;
  });
  if(Array.isArray(src.slots)&&src.slots.length){ state.meals.slots=dedupe(src.slots.map(String)); n++; }
  /* plan entries look like {day:"Monday", meal:"Breakfast", drink:"Milk"} */
  if(Array.isArray(src.plan)) src.plan.forEach(function(e){
    var i=WEEKDAYS.map(function(d){ return d.toLowerCase(); }).indexOf(String(e.day||"").trim().toLowerCase());
    var slot=String(e.meal||"").trim(); if(i<0||!slot) return;
    var key=mealKey(i,slot), cell=state.meals.plan[key]||(state.meals.plan[key]={});
    MEAL_FIELDS.forEach(function(f){ if(e[f.k]) cell[f.k]=String(e[f.k]); });
    if(e.note) cell.note=String(e.note);
    if(!Object.keys(cell).length) delete state.meals.plan[key]; else n++;
  });
  if(n) state.meals.mtime=Date.now();
  return n;
}
function runImport(text){
  text=String(text||"").trim();
  if(!text) throw new Error("Paste something first.");
  var said=[];
  if(text[0]==="{"){
    var data;
    try{ data=JSON.parse(text); }catch(e){ throw new Error("That looks like JSON but doesn't parse. Check you copied all of it."); }
    if(Array.isArray(data.habits)){ var h=importHabits(data.habits); said.push(h+" habit"+(h===1?"":"s")+" added"); }
    if(Array.isArray(data.groceries)){ var g=importGroceries(data.groceries); said.push(g.added+" grocery items added, "+g.updated+" updated"); }
    if(data.meals){ var m=importMeals(data.meals); said.push(m?"meal options updated":"no meal options found"); }
    if(!said.length) throw new Error("Nothing to import. Expected habits, groceries or meals.");
  } else {
    var r=importGroceries(groceriesFromTable(parseTable(text)));
    if(!r.added&&!r.updated) throw new Error("No grocery rows found under the header.");
    said.push(r.added+" grocery items added, "+r.updated+" updated");
  }
  save();
  if(/grocery/.test(said.join(" "))) scheduleNotion();
  return said.join("; ")+".";
}

/* ---------- ask ----------
   Questions go to the Routines Console server (its own repo, on Vercel), which
   answers with Claude and can read and write Notion. Off until configured, like
   sync. The console key lives only in this device's storage: never in the
   document, never in a setup link. Each question carries a plain-text snapshot
   of the tracker so Claude can talk about it; nothing comes back into it. */
var ASKCFG="routines.ask", ASKLOG="routines.askLog";
function readJSON(k){ try{ return JSON.parse(lsGet(k)||"null"); }catch(e){ return null; } }
var askCfg=readJSON(ASKCFG);
if(!askCfg||!askCfg.url||!askCfg.key) askCfg=null;
/* The server stands in for Supabase in the sync code. mint: through the server an
   empty row is a first save, not a mistyped key (see pull). */
function serverCfg(){ return askCfg? {via:"server",url:askCfg.url,key:askCfg.key,mint:true} : null; }
function directCfg(){ try{ return JSON.parse(lsGet(CFGKEY)||"null"); }catch(e){ return null; } }
/* history must alternate user/assistant from a user turn, or the server rejects it */
var askLog=(function(a){
  if(!Array.isArray(a)) return [];
  for(var i=0;i<a.length;i++){
    if(!a[i]||typeof a[i].content!=="string"||a[i].role!==(i%2?"assistant":"user")) return [];
  }
  return a;
})(readJSON(ASKLOG));
var askBusy=false, askDraft="", askNote="", askNoteTrace=null, askEditing=!askCfg, askTraces={};

function saveAskLog(){
  var a=askLog.slice(-40);
  if(a.length&&a[0].role!=="user") a=a.slice(1);
  lsSet(ASKLOG,JSON.stringify(a));
}

/* What Claude sees of the tracker: today's list with ticks, streaks, two weeks of
   scores. Scored with the same functions as the stats view, so the numbers agree. */
function askContext(){
  var t=doneOn(day), lines=[];
  lines.push("Date: "+day+" ("+fmtDay(day,true)+"). Done today: "+t.done+" of "+t.total+".");
  state.sections.forEach(function(sec){
    if(!sec.items.length) return;
    lines.push("");
    lines.push((sec.title||"Untitled")+":");
    sec.items.forEach(function(it){
      var st=itemStreak(it.id);
      lines.push("- ["+(isDone(it.id)?"x":" ")+"] "+it.label+(st>=STREAK_MIN?" (streak "+st+" days)":""));
    });
  });
  lines.push("");
  lines.push("Full-day streak: "+curStreak()+" days (best "+bestStreak()+"). Only 100% days count toward it.");
  var keys=rangeKeys(14);
  if(keys.length) lines.push("Last "+keys.length+" days: "+keys.map(function(k){
    return k.slice(5)+" "+Math.round(pctOn(k)*100)+"%";
  }).join(", ")+".");
  var need=state.groceries.items.filter(function(it){ return it.need; });
  lines.push("");
  lines.push("Groceries needed: "+(need.length?need.length:"none")+".");
  groupBy(need,firstStore).forEach(function(g){
    lines.push("- "+g.name+": "+g.items.map(function(it){ return it.name+(it.note?" ("+it.note+")":""); }).join(", "));
  });
  lines.push("");
  lines.push("Meal plan, week of "+weekStart()+":");
  WEEKDAYS.forEach(function(d,i){
    var parts=state.meals.slots.map(function(sl){
      var c=mealAt(i,sl), picks=MEAL_FIELDS.map(function(f){ return c[f.k]; }).filter(Boolean);
      return picks.length? sl+": "+picks.join(", ")+(c.done?" (prepped)":"") : "";
    }).filter(Boolean);
    if(parts.length) lines.push("- "+d+(i===weekIdx()?" (today)":"")+": "+parts.join("; "));
  });
  return lines.join("\n").slice(0,12000);
}

function askSetup(host){
  var box=document.createElement("div"); box.className="ask-setup";
  var pad=document.createElement("div"); pad.className="dpad";
  var intro=document.createElement("p");
  intro.textContent="Connect this device to your Routines server once. It syncs your list with your other devices, turns on Ask, and keeps groceries in step with Notion. The key stays on this device.";
  pad.appendChild(intro);
  var fUrl=field("Server address", askCfg?askCfg.url:(lsGet(ASKPEND)||""), "https://your-server.up.railway.app");
  var fKey=field("Server key", "", askCfg?"Saved. Paste a new one to replace it.":"The key you set as CONSOLE_SECRET");
  fKey.input.type="password"; fKey.input.autocomplete="current-password";
  pad.appendChild(fUrl); pad.appendChild(fKey);

  function say(t){ msg.textContent=t; msg.hidden=!t; }

    if(!/^https:\/\/[^\s/]+/i.test(url)){ say("The address must start with https://"); return; }
    if(!key){ say("Paste the server key."); return; }
    go.disabled=true; go.textContent="Checking…"; say("");
    fetch(url+"/api/status",{headers:{"Authorization":"Bearer "+key}}).then(function(res){
      if(res.status===401) throw new Error("That key didn't match the server.");
      if(!res.ok) return res.json().catch(function(){ return {}; }).then(function(d){
        throw new Error((d&&d.error)||("The server answered "+res.status+"."));
      });
      askCfg={url:url,key:key}; lsSet(ASKCFG,JSON.stringify(askCfg)); lsDel(ASKPEND);
      /* the server holds the Supabase details now; don't leave a copy on this device */
      lsDel(CFGKEY); lsDel(PENDKEY); pending=null;

    }).catch(function(e){

      askCfg=null; lsDel(ASKCFG); askEditing=true; cfg=directCfg();
      setSync(cfg?"busy":"off",cfg?"Syncing…":"Local only"); render(); if(cfg) pull();
    }));
  }
  pad.appendChild(acts);
  box.appendChild(pad); host.appendChild(box);
}

function askSend(text){
  text=String(text||"").trim();
  if(!text||askBusy||!askCfg) return;
  askLog.push({role:"user",content:text});
  askDraft=""; askNote=""; askNoteTrace=null; askBusy=true;
  renderChat(); window.scrollTo(0,document.body.scrollHeight);
  var tz=""; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""; }catch(e){}
  fetch(askCfg.url+"/api/chat",{
    method:"POST",
    headers:{"Authorization":"Bearer "+askCfg.key,"Content-Type":"application/json"},
    body:JSON.stringify({messages:askLog.slice(-39),timeZone:tz,context:askContext()})
  }).then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(d){ return {status:res.status,data:d||{}}; });
  }).then(function(r){
    if(r.status===200&&typeof r.data.reply==="string"){
      noteWho(r.data.model);
      askLog.push({role:"assistant",content:r.data.reply});
      askTraces[askLog.length-1]=r.data.trace||[];
      saveAskLog();
      return;
    }
    askLog.pop(); askDraft=text; askNoteTrace=r.data.trace||null;
    askNote = r.status===401
      ? "Your server key was rejected. Open Server settings and paste it again."
      : (r.data.error||("Your server answered "+r.status+"."));
  },function(){
    askLog.pop(); askDraft=text;
    askNote="Couldn't reach your Routines server. Check your connection and send again.";
  }).then(function(){
    askBusy=false;
    if(view==="chat"){ renderChat(); window.scrollTo(0,document.body.scrollHeight); }
  });
}

/* ---------- groceries ⇄ Notion ----------
   With the console connected, the grocery list and a Notion database stay in step both
   ways. The app sends its whole list (each item with t, its last edit here, and s, when
   it last matched Notion) plus the ids it deleted; the console reconciles item by item
   and returns the merged list, which replaces this one. Runs a few seconds after a
   change, when the app opens, and when it comes back to the foreground. The cart tick
   (got) never leaves the device - it only means something mid-shop. */
var notionSync={state:"",at:0,msg:""}, notionTimer=null, notionBusy=false, notionAgain=false, notionLast=0;
function tombstone(id){
  var d=state.groceries.deleted||(state.groceries.deleted=[]);
  if(d.indexOf(id)<0) d.push(id);
  if(d.length>300) d.splice(0,d.length-300);
}
function scheduleNotion(ms){
  if(!askCfg) return;
  clearTimeout(notionTimer);
  notionTimer=setTimeout(syncNotion, ms==null?4000:ms);
}
/* on open and on return: at most once a minute, so flicking between apps costs nothing */
function freshenNotion(){
  if(askCfg&&!notionBusy&&Date.now()-notionLast>60000) scheduleNotion(1500);
}
function syncNotion(){
  if(!askCfg) return;
  if(notionBusy){ notionAgain=true; return; }
  notionBusy=true; notionLast=Date.now(); notionSync={state:"busy",at:0,msg:""}; paintNotion();
  var epoch=groEpoch, sentDeleted=(state.groceries.deleted||[]).slice();
  var items=state.groceries.items.map(function(it){
    var o={id:it.id,name:it.name,need:!!it.need,group:it.group||"",store:it.store||"",note:it.note||""};
    if(it.t) o.t=it.t; if(it.s) o.s=it.s;
    return o;
  });
  fetch(askCfg.url+"/api/groceries",{
    method:"POST",
    headers:{"Authorization":"Bearer "+askCfg.key,"Content-Type":"application/json"},
    body:JSON.stringify({items:items,deleted:sentDeleted})
  }).then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(d){ return {status:res.status,data:d||{}}; });
  }).then(function(r){
    if(r.status!==200||!Array.isArray(r.data.items)){
      notionSync={state:"err",at:0,msg:r.data.error||("Notion sync failed ("+r.status+").")};
      return;
    }
    notionSync={state:"ok",at:Date.now(),msg:""};
    /* edited while this was in flight: the reply is already stale, so go again */
    if(epoch!==groEpoch){ notionAgain=true; return; }
    applyNotion(r.data.items, sentDeleted);
  },function(){
    notionSync={state:"err",at:0,msg:"Couldn't reach your Routines server, so Notion wasn't synced."};
  }).then(function(){
    notionBusy=false; paintNotion();
    if(notionAgain){ notionAgain=false; syncNotion(); }
  });
}
function applyNotion(items,sentDeleted){
  var got={}, before=JSON.stringify(state.groceries.items);
  state.groceries.items.forEach(function(it){ if(it.got) got[it.id]=1; });
  state.groceries.items=items.map(function(x){
    var it={id:x.id,name:x.name,group:x.group||"",store:x.store||"",note:x.note||"",need:!!x.need};
    if(x.t) it.t=x.t; if(x.s) it.s=x.s;
    if(got[it.id]&&it.need) it.got=true;
    return it;
  });
  /* the deletes just sent are done; keep any made since */
  state.groceries.deleted=(state.groceries.deleted||[]).filter(function(id){ return sentDeleted.indexOf(id)<0; });
  /* stamp the list so other devices take it, but don't sync it straight back */
  state.groceries.mtime=Date.now(); save();
  if(JSON.stringify(state.groceries.items)!==before&&view==="groceries") render();
}
function notionLabel(){
  if(notionSync.state==="busy") return "Syncing with Notion…";
  if(notionSync.state==="err") return notionSync.msg;
  if(notionSync.state==="ok"){
    var m=Math.round((Date.now()-notionSync.at)/60000);
    return "Synced with Notion "+(m<1?"just now":m+" min ago");
  }
  return "Syncs with Notion both ways";
}
function paintNotion(){
  var el=document.getElementById("notionState");
  if(!el) return;
  el.textContent=notionLabel();
  el.className="pane-sub"+(notionSync.state==="err"?" err":"");
}

function render(){
  if(drag) stopDrag(false);
  var onStats = view==="stats", onList = view==="list";
  ["meter","quoteHost","sections","dayNote","editTools","log","note","fab"].forEach(function(id){
    $(id).hidden = !onList;
  });
  $("wordmark").hidden = onStats;
  $("back").hidden = !onStats;
  $("stats").hidden = !onStats;
  $("meals").hidden = view!=="meals";
  $("groceries").hidden = view!=="groceries";
  $("chat").hidden = view!=="chat";
  $("tabs").hidden = onStats;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){
    var on=b.getAttribute("data-tab")===view;
    b.classList.toggle("on",on);
    if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  renderHeader();
  if(onStats){ renderStats(); return; }
  if(view==="meals"){ renderMeals(); return; }
  if(view==="groceries"){ renderGroceries(); paintNotion(); return; }
  if(view==="chat"){ renderChat(); return; }
  renderQuote(); renderSections(); renderDayNote(); renderEditTools(); renderLog(); renderNote();
  $("fabLabel").textContent = editing? "Done" : "Edit list";
  $("fab").classList.toggle("on", editing);
  $("fab").querySelector("svg").innerHTML = editing
    ? '<path d="m5 12.6 4.4 4.4L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    : '<path d="M12 20h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
}

function endEdit(){
  if(!editing) return;
  state.sections.forEach(function(s){
    s.items=s.items.filter(function(it){ return it.label.trim()!==""; });
  });
  state.sections=state.sections.filter(function(s){ return s.items.length||s.title.trim(); });
  editing=false;
  touchToday();
  save();
}

$("fab").addEventListener("click",function(){
  if(editing){ endEdit(); render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  editing=true;
  render();
});

/* Two views, one file. The history entry is what makes a browser back button
   and a trackpad swipe land on the list instead of leaving the app. */
function goStats(k){
  endEdit();
  openDay=k||null;
  if(view!=="stats"){
    view="stats";
    try{ history.pushState({routines:"stats"},""); }catch(e){}
  }
  render();
  window.scrollTo(0,0);
}
function goList(){
  if(view!=="stats") return;
  if(history.state&&history.state.routines==="stats"){ history.back(); return; }
  view="list"; openDay=null;
  render();
  window.scrollTo(0,0);
}
window.addEventListener("popstate",function(){
  if(view!=="stats") return;
  view="list"; openDay=null;
  render();
  window.scrollTo(0,0);
});
$("back").addEventListener("click",goList);
/* Tabs swap the top-level view in place. No history entry: back from Meals should
   leave the app the way it would from the list, not walk through every tab. */
Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){
  b.addEventListener("click",function(){
    var next=b.getAttribute("data-tab");
    if(next===view) { window.scrollTo({top:0,behavior:"smooth"}); return; }
    endEdit(); groEditing=null; mealOptsOpen=false;
    view=next; render(); window.scrollTo(0,0);
  });
});

/* Delegated: the hosts are emptied and refilled on every render, never replaced. */
function chartClick(e){
  if(!e.target||!e.target.closest) return;
  var r=e.target.closest("[data-range]");
  if(r){ rangeIdx=+r.getAttribute("data-range"); openDay=null; renderStats(); return; }
  if(e.target.closest("[data-more]")){ goStats(null); return; }
  var b=e.target.closest("[data-day]");
  if(!b) return;
  var k=b.getAttribute("data-day");
  if(view==="stats"){ openDay = openDay===k ? null : k; renderStats(); }
  else goStats(k);
}
$("log").addEventListener("click",chartClick);
$("stats").addEventListener("click",chartClick);

$("chip").addEventListener("click",function(){
  if(cfg&&sync.state!=="busy"){ pull(); return; }
  if(!cfg&&lsGet(ASKPEND)){ view="chat"; render(); window.scrollTo(0,0); return; }
  editing=true; render();
  var p=document.getElementById("syncPanel");
  if(p){ p.open=true; p.scrollIntoView({behavior:"smooth",block:"center"}); }
});

setInterval(function(){
  var t=today();
  if(t!==day){ day=t; render(); }
},20000);
document.addEventListener("visibilitychange",function(){
  if(document.hidden) return;
  freshenNotion();
  var t=today(); if(t!==day) day=t;
  render(); pull();
});
window.addEventListener("focus",function(){ pull(); freshenNotion(); });
window.addEventListener("resize",function(){
  var host=$("dayNote");
  if(!host||host.hidden) return;
  fitNote(host.querySelector("textarea"));
});

markClean();
if(askCfg) cfg=serverCfg();
else if(lsGet(ASKPEND)&&!cfg) setSync("off","Connect");
if(cfg) setSync("busy","Syncing…");
/* arrived on a setup link: the panel lives in edit mode, so say so on the chip -
   tapping it opens the panel, which is where the secret key gets pasted. */
else if(pending) setSync("off","Finish setup");
render();
if(cfg) pull();
/* after the Supabase pull has had a moment, so a fresh device syncs the merged list */
if(askCfg) setTimeout(freshenNotion, 1500);
})();
</script>
